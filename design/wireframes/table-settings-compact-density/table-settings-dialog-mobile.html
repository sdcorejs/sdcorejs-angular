<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Table settings compact density - mobile</title>
    <style>
      :root {
        --surface: #fff;
        --canvas: #dfe4eb;
        --border: #d8dde5;
        --row-border: #e5e8ed;
        --primary: #0874c9;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 390px;
        max-width: 390px;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: var(--canvas);
        color: #25282e;
        font-family: Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      .app-backdrop {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #d9e0e8 0, #edf1f5 45%, #d7dde6 100%);
      }
      .context {
        padding: 18px 16px;
        color: #56606d;
        font-size: 12px;
      }
      .context strong {
        display: block;
        margin-bottom: 4px;
        color: #27303a;
        font-size: 14px;
      }
      .sheet {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 390px;
        max-width: 390px;
        min-width: 0;
        height: min(80vh, calc(100vh - 16px));
        overflow: hidden;
        border-radius: 24px 24px 0 0;
        background: var(--surface);
        box-shadow: 0 -12px 38px rgba(32, 41, 54, 0.2);
      }
      .header {
        display: flex;
        min-height: 64px;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
      }
      .header h1 {
        margin: 0;
        font-size: 18px;
        line-height: 24px;
      }
      .close {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border: 0;
        background: transparent;
        color: #5b626d;
        font-size: 22px;
      }
      .table-viewport {
        position: relative;
        width: 100%;
        max-width: 100%;
        height: calc(100% - 120px);
        overflow: auto;
      }
      .table {
        min-width: 850px;
      }
      .head,
      .row {
        display: grid;
        grid-template-columns: 84px minmax(290px, 1fr) 92px 96px 126px;
        align-items: center;
        padding: 0 12px;
      }
      .head {
        position: sticky;
        z-index: 2;
        top: 0;
        min-height: 40px;
        border-bottom: 1px solid #cfd5de;
        background: #f7f8fa;
        font-size: 13px;
        font-weight: 600;
      }
      .row {
        min-height: 40px;
        border-bottom: 1px solid var(--row-border);
        background: #fff;
        font-size: 13px;
      }
      .visible {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .drag {
        display: grid;
        width: 24px;
        height: 32px;
        place-items: center;
        color: #747b86;
        font-size: 18px;
      }
      .field {
        display: flex;
        height: 32px;
        align-items: center;
        padding: 0 10px;
        border: 1px solid #c8ced8;
        border-radius: 4px;
        background: #fbfbfd;
      }
      .width-field {
        width: 66px;
      }
      .center {
        display: flex;
        justify-content: center;
      }
      .switch {
        display: flex;
        width: 32px;
        height: 40px;
        align-items: center;
        justify-content: center;
        border: 0;
        padding: 0;
        background: transparent;
      }
      .track {
        position: relative;
        display: block;
        width: 32px;
        height: 18px;
        border-radius: 99px;
        background: #d8dbe1;
        box-shadow: inset 0 0 0 1px #8b919b;
      }
      .thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        display: grid;
        width: 14px;
        height: 14px;
        place-items: center;
        border-radius: 50%;
        background: #555b65;
        color: #fff;
        font-size: 9px;
        font-weight: 700;
      }
      .switch.on .track {
        background: var(--primary);
        box-shadow: none;
      }
      .switch.on .thumb {
        left: 16px;
        background: #fff;
        color: var(--primary);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .scroll-hint {
        position: absolute;
        z-index: 3;
        top: 40px;
        right: 0;
        bottom: 0;
        display: flex;
        width: 42px;
        align-items: center;
        justify-content: flex-end;
        padding-right: 8px;
        pointer-events: none;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.94));
        color: #727984;
        font-size: 18px;
      }
      .footer {
        position: absolute;
        bottom: 0;
        left: 0;
        display: flex;
        width: 390px;
        max-width: 390px;
        min-width: 0;
        min-height: 56px;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        padding: 0 16px;
        overflow: hidden;
        border-top: 1px solid var(--border);
        background: #fff;
      }
      .action {
        height: 32px;
        padding: 0 13px;
        border: 0;
        border-radius: 18px;
        font-size: 13px;
        font-weight: 600;
      }
      .neutral {
        background: #eff1f4;
        color: #656b75;
      }
      .secondary {
        background: #e5f1fb;
        color: #0870c2;
      }
      .primary {
        background: #0870c2;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="app-backdrop">
      <div class="context"><strong>SdTable mobile context</strong>Dialog tự chuyển thành bottom sheet; bảng giữ horizontal scroll.</div>
    </div>
    <section class="sheet" aria-label="Thiết lập bảng" data-story="UR-1 UR-2 UR-3 UR-4" data-ac="AC-D1 AC-D2 AC-D3 AC-D4 AC-D5 AC-D6">
      <header class="header">
        <h1>Thiết lập bảng</h1>
        <button class="close" aria-label="Đóng">×</button>
      </header>
      <div class="table-viewport">
        <div class="table">

          </div>
          <div class="row">
            <div class="visible">
              <span class="drag">⠿</span
              ><button class="switch on">
                <span class="track"><span class="thumb">✓</span></span>
              </button>
            </div>
            <span class="field">Họ và tên</span><span class="field width-field">180</span
            ><span class="center"
              ><button class="switch">
                <span class="track"><span class="thumb">−</span></span>
              </button></span
            ><span class="center"
              ><button class="switch">
                <span class="track"><span class="thumb">−</span></span>
              </button></span
            >
          </div>
          <div class="row">
            <div class="visible">
              <span class="drag">⠿</span
              ><button class="switch on">
                <span class="track"><span class="thumb">✓</span></span>
              </button>
            </div>
            <span class="field">Email</span><span class="field width-field">220</span
            ><span class="center"
              ><button class="switch">
                <span class="track"><span class="thumb">−</span></span>
              </button></span
            ><span class="center"
              ><button class="switch">
                <span class="track"><span class="thumb">−</span></span>
              </button></span
            >
          </div>
          <div class="row">
            <div class="visible">
              <span class="drag">⠿</span
              ><button class="switch on">
                <span class="track"><span class="thumb">✓</span></span>
              </button>
            </div>
            <span class="field">Phòng ban</span><span class="field width-field">140</span
            ><span class="center"
              ><button class="switch">
                <span class="track"><span class="thumb">−</span></span>
              </button></span
            ><span class="center"
              ><button class="switch">
                <span class="track"><span class="thumb">−</span></span>
              </button></span
            >
          </div>
          <div class="row">
            <div class="visible">
              <span class="drag">⠿</span
              ><button class="switch on">
                <span class="track"><span class="thumb">✓</span></span>
              </button>
            </div>
            <span class="field">Chức vụ</span><span class="field width-field">160</span
            ><span class="center"
              ><button class="switch">
                <span class="track"><span class="thumb">−</span></span>
              </button></span
            ><span class="center"
              ><button class="switch">
                <span class="track"><span class="thumb">−</span></span>
              </button></span
            >
          </div>
          <div class="row">
            <div class="visible">
              <span class="drag">⠿</span
              ><button class="switch on">
                <span class="track"><span class="thumb">✓</span></span>
              </button>
            </div>
            <span class="field">Lương</span><span class="field width-field">140</span
            ><span class="center"
              ><button class="switch">
                <span class="track"><span class="thumb">−</span></span>
              </button></span
            ><span class="center"
              ><button class="switch">
                <span class="track"><span class="thumb">−</span></span>
              </button></span
            >
          </div>
          <div class="row">
            <div class="visible">
              <span class="drag">⠿</span
              ><button class="switch on">
                <span class="track"><span class="thumb">✓</span></span>
              </button>
            </div>
            <span class="field">Trạng thái</span><span class="field width-field">130</span
            ><span class="center"
              ><button class="switch">
                <span class="track"><span class="thumb">−</span></span>
              </button></span
            ><span class="center"
              ><button class="switch">
                <span class="track"><span class="thumb">−</span></span>
              </button></span
            >
          </div>
          <div class="row">
            <div class="visible">
              <span class="drag">⠿</span
              ><button class="switch on">
                <span class="track"><span class="thumb">✓</span></span>
              </button>
            </div>
            <span class="field">Ngày vào</span><span class="field width-field">150</span
            ><span class="center"
              ><button class="switch">
                <span class="track"><span class="thumb">−</span></span>
              </button></span
            ><span class="center"
              ><button class="switch">
                <span class="track"><span class="thumb">−</span></span>
              </button></span
            >
          </div>
        </div>
        <div class="scroll-hint" aria-hidden="true">→</div>
      </div>
      <footer class="footer" data-story="UR-1" data-ac="AC-D1 AC-D6">
        <button class="action neutral">Bỏ qua</button><button class="action secondary">Mặc định</button
        ><button class="action primary">Áp dụng</button>
      </footer>
    </section>
    <script>
      // Wireframe semantics mirror the production MatTable/SdSwitch contract without adding visual noise.
      const table = document.querySelector('.table');
      table.setAttribute('role', 'table');
      const headerRow = table.querySelector('.head');
      headerRow.setAttribute('role', 'row');
      [...headerRow.children].forEach(cell => cell.setAttribute('role', 'columnheader'));
      table.querySelectorAll('.row').forEach(row => {
        row.setAttribute('role', 'row');
        [...row.children].forEach(cell => cell.setAttribute('role', 'cell'));
        const rowLabel = row.querySelector('.field').textContent.trim();
        const labels = [`Hiển thị ${rowLabel}`, `Cố định ${rowLabel}`, `Giới hạn ký tự ${rowLabel}`];
        row.querySelectorAll('.switch').forEach((control, index) => {
          control.setAttribute('role', 'switch');
          control.setAttribute('aria-checked', control.classList.contains('on') ? 'true' : 'false');
          control.setAttribute('aria-label', labels[index]);
        });
      });
    </script>
  </body>
</html>
