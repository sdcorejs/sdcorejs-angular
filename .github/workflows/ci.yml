name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-version-sync:
    name: Verify four-line workspace sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Verify generated workspaces
        run: npm run check:sync

  scripts:
    name: Repository script tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            versions/v19/package-lock.json

      - name: Install orchestrator dependencies
        run: npm ci

      # why: the theme, contrast, token-list and hex-rule tests compile the library SCSS and run ESLint
      # with the canonical v19 toolchain.
      - name: Install v19 exactly
        run: npm ci --legacy-peer-deps
        working-directory: versions/v19

      - name: Run repository contracts
        run: npm run test:scripts

      - name: Check library colours use tokens
        run: npm run check:scss-hex

  canonical-v19:
    name: Canonical v19 lint, build and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: versions/v19/package-lock.json

      - name: Install v19 exactly
        run: npm ci --legacy-peer-deps
        working-directory: versions/v19

      - name: Lint v19
        run: npm run lint
        working-directory: versions/v19

      - name: Build v19
        run: npm run build
        working-directory: versions/v19

      - name: Run v19 coverage suite
        run: npx ng test sdcorejs-angular --watch=false --browsers=ChromeHeadlessCI --code-coverage
        working-directory: versions/v19

  compatibility:
    name: Angular compatibility (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v20
          - version: v21
          - version: v22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: versions/${{ matrix.version }}/package-lock.json

      - name: Install historical workspace exactly
        if: ${{ matrix.version != 'v22' }}
        run: npm ci --legacy-peer-deps
        working-directory: versions/${{ matrix.version }}

      - name: Install Angular 22 workspace exactly
        if: ${{ matrix.version == 'v22' }}
        run: npm ci
        working-directory: versions/${{ matrix.version }}

      - name: Lint package line
        run: npm run lint
        working-directory: versions/${{ matrix.version }}

      - name: Build package line
        run: npm run build
        working-directory: versions/${{ matrix.version }}

      - name: Run new-major Angular 22 coverage suite
        if: ${{ matrix.version == 'v22' }}
        run: npx ng test sdcorejs-angular --watch=false --browsers=ChromeHeadlessCI --code-coverage
        working-directory: versions/${{ matrix.version }}

      - name: Run changed-component regressions on historical majors
        if: ${{ matrix.version != 'v22' }}
        run: >-
          npx ng test sdcorejs-angular --watch=false --browsers=ChromeHeadlessCI
          --include=projects/sdcorejs-angular/components/file-explorer/**/*.spec.ts
          --include=projects/sdcorejs-angular/components/form-generic/**/*.spec.ts
          --include=projects/sdcorejs-angular/components/button/**/*.spec.ts
          --include=projects/sdcorejs-angular/components/tab/**/*.spec.ts
          --include=projects/sdcorejs-angular/components/stepper/**/*.spec.ts
          --include=projects/sdcorejs-angular/components/window/**/*.spec.ts
          --include=projects/sdcorejs-angular/components/modal-resizable/**/*.spec.ts
          --include=projects/sdcorejs-angular/components/editor-engine/**/*.spec.ts
          --include=projects/sdcorejs-angular/components/editor/**/*.spec.ts
          --include=projects/sdcorejs-angular/components/mini-editor/**/*.spec.ts
          --include=projects/sdcorejs-angular/services/confirm/**/*.spec.ts
        working-directory: versions/${{ matrix.version }}

  e2e:
    name: Showcase e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: |
            versions/v19/package-lock.json
            showcase/package-lock.json

      - name: Install v19 exactly
        run: npm ci --legacy-peer-deps
        working-directory: versions/v19

      # why: the Showcase runs on the built library (npm run link:library copies versions/v19/dist).
      - name: Build v19
        run: npm run build
        working-directory: versions/v19

      - name: Install Showcase exactly
        run: npm ci --legacy-peer-deps
        working-directory: showcase

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: showcase

      - name: Run e2e in the Asia/Bangkok and UTC browser zones
        run: npm run e2e
        working-directory: showcase
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: showcase-playwright-report
          path: |
            showcase/playwright-report
            showcase/test-results
          retention-days: 7
