name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-version-sync:
    name: Verify four-line workspace sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify generated workspaces
        run: npm run check:sync

  scripts:
    name: Repository script tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install orchestrator dependencies
        run: npm ci

      - name: Run repository contracts
        run: npm run test:scripts

  canonical-v19:
    name: Canonical v19 lint, build and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: versions/v19/package-lock.json

      - name: Install v19 exactly
        run: npm ci --legacy-peer-deps
        working-directory: versions/v19

      - name: Lint v19
        run: npm run lint
        working-directory: versions/v19

      - name: Build v19
        run: npm run build
        working-directory: versions/v19

      - name: Run v19 coverage suite
        run: npx ng test sdcorejs-angular --watch=false --browsers=ChromeHeadlessCI --code-coverage
        working-directory: versions/v19

  compatibility:
    name: Angular compatibility (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v20
          - version: v21
          - version: v22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: versions/${{ matrix.version }}/package-lock.json

      - name: Install historical workspace exactly
        if: ${{ matrix.version != 'v22' }}
        run: npm ci --legacy-peer-deps
        working-directory: versions/${{ matrix.version }}

      - name: Install Angular 22 workspace exactly
        if: ${{ matrix.version == 'v22' }}
        run: npm ci
        working-directory: versions/${{ matrix.version }}

      - name: Lint package line
        run: npm run lint
        working-directory: versions/${{ matrix.version }}

      - name: Build package line
        run: npm run build
        working-directory: versions/${{ matrix.version }}

      - name: Run new-major Angular 22 coverage suite
        if: ${{ matrix.version == 'v22' }}
        run: npx ng test sdcorejs-angular --watch=false --browsers=ChromeHeadlessCI --code-coverage
        working-directory: versions/${{ matrix.version }}
