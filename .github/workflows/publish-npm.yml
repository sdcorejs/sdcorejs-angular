name: Publish @sdcorejs/angular to npm

on:
  push:
    tags:
      - 'v2.5'
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-npm-v2.5
  cancel-in-progress: false

jobs:
  verify_source:
    name: Verify release source and contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.release_plan.outputs.source_sha }}
      targets_json: ${{ steps.release_plan.outputs.targets_json }}

    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/tags/v2.5' || github.ref }}

      - name: Require the release tag commit to be on main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve the immutable four-target release plan
        id: release_plan
        run: |
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node --input-type=module -e "import {releaseTargets} from './scripts/release-package-contract.mjs';process.stdout.write('targets_json='+JSON.stringify(releaseTargets('2.5'))+'\n')" >> "$GITHUB_OUTPUT"

      - name: Pin npm used by the release contract
        run: |
          npm install -g npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Install orchestrator dependencies
        run: npm ci

      - name: Verify generated workspaces
        run: npm run check:sync

      - name: Run repository and release-contract tests
        run: npm run test:scripts

  test-v19:
    name: Canonical v19 lint, build and coverage
    needs: verify_source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify_source.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: versions/v19/package-lock.json

      - name: Pin npm used by the canonical release gate
        run: |
          npm install -g npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Install v19 exactly
        run: npm ci --legacy-peer-deps
        working-directory: versions/v19

      - name: Lint v19
        run: npm run lint
        working-directory: versions/v19

      - name: Build v19
        run: npm run build
        working-directory: versions/v19

      - name: Run canonical coverage suite
        run: npx ng test sdcorejs-angular --watch=false --browsers=ChromeHeadlessCI --code-coverage
        working-directory: versions/v19

  build-pack:
    name: Build immutable package (${{ matrix.version }})
    needs: [verify_source, test-v19]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v19
            major: 19
          - version: v20
            major: 20
          - version: v21
            major: 21
          - version: v22
            major: 22

    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify_source.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: versions/${{ matrix.version }}/package-lock.json

      - name: Pin npm used to create the artifact
        run: |
          npm install -g npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Install historical workspace exactly
        if: ${{ matrix.version != 'v22' }}
        run: npm ci --legacy-peer-deps
        working-directory: versions/${{ matrix.version }}

      - name: Install Angular 22 workspace exactly
        if: ${{ matrix.version == 'v22' }}
        run: npm ci
        working-directory: versions/${{ matrix.version }}

      - name: Select the matrix target from the validated plan
        id: target
        env:
          TARGETS_JSON: ${{ needs.verify_source.outputs.targets_json }}
          TARGET_WORKSPACE: ${{ matrix.version }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const targets = JSON.parse(process.env.TARGETS_JSON);
          const target = targets.find(item => item.workspace === process.env.TARGET_WORKSPACE);
          if (!target) throw new Error('matrix target is absent from the validated plan');
          if (!process.env.GITHUB_OUTPUT) throw new Error('GITHUB_OUTPUT is unavailable');
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `version=${target.version}\ntarget_json=${JSON.stringify(target)}\n`,
            'utf8',
          );
          NODE

      - name: Stamp exact release version
        run: node -e "const fs=require('node:fs');const p='projects/sdcorejs-angular/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='${{ steps.target.outputs.version }}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
        working-directory: versions/${{ matrix.version }}

      - name: Lint package line
        run: npm run lint
        working-directory: versions/${{ matrix.version }}

      - name: Build package line
        run: npm run build
        working-directory: versions/${{ matrix.version }}

      - name: Pack once and record immutable metadata
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.verify_source.outputs.source_sha }}
          TARGET_JSON: ${{ steps.target.outputs.target_json }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          STAGE="release-stage/${{ matrix.version }}"
          mkdir -p "$STAGE"
          npm pack "versions/${{ matrix.version }}/dist/sdcorejs-angular" --json --pack-destination "$STAGE" > "$STAGE/pack.json"
          TARBALL="$(node -e "const p=require('./$STAGE/pack.json')[0];process.stdout.write(p.filename)")"
          SHA256="$(sha256sum "$STAGE/$TARBALL" | awk '{print $1}')"
          INTEGRITY="$(node -e "const p=require('./$STAGE/pack.json')[0];process.stdout.write(p.integrity)")"
          SHASUM="$(node -e "const p=require('./$STAGE/pack.json')[0];process.stdout.write(p.shasum)")"
          printf '%s  %s\n' "$SHA256" "$TARBALL" > "$STAGE/sha256.txt"
          export STAGE TARBALL SHA256 SOURCE_SHA INTEGRITY SHASUM
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const target = JSON.parse(process.env.TARGET_JSON);
          const pack = JSON.parse(readFileSync(`${process.env.STAGE}/pack.json`, 'utf8'))[0];
          if (pack.integrity !== process.env.INTEGRITY || pack.shasum !== process.env.SHASUM) throw new Error('npm pack metadata changed');
          writeFileSync(`${process.env.STAGE}/artifact.json`, `${JSON.stringify({
            target,
            tarball: process.env.TARBALL,
            sha256: process.env.SHA256,
            sourceSha: process.env.SOURCE_SHA,
            pack,
          }, null, 2)}\n`);
          NODE

      - name: Upload immutable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcorejs-angular-${{ matrix.version }}-2.5
          path: release-stage
          if-no-files-found: error
          retention-days: 14

  verify-packages:
    name: Verify all four retained packages
    needs: [verify_source, build-pack]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify_source.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          registry-url: 'https://registry.npmjs.org'

      - name: Pin npm used by package verification
        run: |
          npm install -g npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Download every package artifact
        uses: actions/download-artifact@v4
        with:
          pattern: sdcorejs-angular-v*-2.5
          path: release-artifacts
          merge-multiple: true

      - name: Declare the complete verification set
        run: echo "verify artifact workspaces v19 v20 v21 v22 with sha256 integrity shasum"

      - name: Validate baselines and compile unchanged strict consumers
        run: node scripts/release-package-contract.mjs --artifact-root release-artifacts --suffix 2.5 --baseline-suffix 2.4 --datetime-version 1.0.4 --compile-consumers

  publish-packages:
    name: Publish the verified transaction
    needs: [verify_source, verify-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify_source.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          registry-url: 'https://registry.npmjs.org'

      - name: Pin trusted-publishing npm
        run: |
          npm install -g npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Download the already verified package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sdcorejs-angular-v*-2.5
          path: release-artifacts
          merge-multiple: true

      - name: Execute one fail-closed publish transaction
        run: node scripts/release-package-contract.mjs --artifact-root release-artifacts --suffix 2.5 --baseline-suffix 2.4 --datetime-version 1.0.4 --publish --require-provenance

  publish-docs-and-page:
    name: Publish verified docs and static page
    needs: [verify_source, publish-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the immutable release source for the archive commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.verify_source.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          registry-url: 'https://registry.npmjs.org'

      - name: Pin npm used for postpublish verification
        run: |
          npm install -g npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Download the verified package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sdcorejs-angular-v*-2.5
          path: release-artifacts
          merge-multiple: true

      - name: Revalidate and materialize the verified v19 package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-package-contract.mjs --artifact-root release-artifacts --suffix 2.5 --baseline-suffix 2.4 --datetime-version 1.0.4 > verified-release.json
          V19_TARBALL="$(find release-artifacts/v19 -type f -name '*.tgz' -print -quit)"
          test -n "$V19_TARBALL"
          sha256sum "$V19_TARBALL"
          node -e "const a=require('./release-artifacts/v19/artifact.json');if(!a.pack.integrity)throw new Error('integrity missing')"
          mkdir -p versions/v19/dist/sdcorejs-angular
          tar -xzf "$V19_TARBALL" --strip-components=1 -C versions/v19/dist/sdcorejs-angular

      - name: Clean-install Showcase
        run: npm --prefix showcase ci --legacy-peer-deps

      - name: Generate all four API-doc archives
        run: npm run collect-release-docs -- --patch 2.5 --date "$(date -u +%F)" --commit "${{ needs.verify_source.outputs.source_sha }}" --skip-existing

      - name: Build and retain static release page
        shell: bash
        run: |
          npm run build:page -- --suffix 2.5
          test -d published-pages/2.5
          test ! -d published-pages/2.0
          node -e "const p=require('./published-pages/pages.json');const retained2x=p.suffixes.filter(s=>s.startsWith('2.'));if(p.latest!=='2.5'||retained2x.join(',')!=='2.5,2.4,2.3,2.2,2.1'||!p.suffixes.some(s=>s.startsWith('1.')))throw new Error('published-pages retention mismatch')"

      - name: Commit generated docs and page
        shell: bash
        run: |
          if test -z "$(git status --porcelain published-docs published-pages)"; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published-docs published-pages
          git commit -m "docs: publish Angular 22 release 2.5"
          SOURCE_SHA="${{ needs.verify_source.outputs.source_sha }}"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git rebase --onto origin/main "$SOURCE_SHA" HEAD
          git push origin HEAD:main
