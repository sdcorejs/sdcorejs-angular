name: Publish @sdcorejs/angular to npm

# Convention: tag = `v<release-suffix>` (example `v1.0`, `v1.0-beta.1`) with no Angular major.
# The workflow expands one release tag into 3 package versions:
#   v1.0        -> 19.1.0 / 20.1.0 / 21.1.0 (npm dist-tag latest)
#   v1.0-beta.1 -> 19.1.0-beta.1 / 20.1.0-beta.1 / 21.1.0-beta.1 (npm dist-tag beta)
#
# After all 3 npm publishes succeed, the tag workflow snapshots published-docs
# for the same 3 versions and commits the archive back to `main`.
# Release commits are expected to have already run the v19 -> v20/v21 rollout
# (`npm run sync`); this workflow builds and publishes the checked-in workspaces.
#
# Gates that run BEFORE anything is published:
#   verify-version-sync  - v20/v21 still match the v19 source of truth
#   test                 - the full v19 Karma/Jasmine suite + coverage thresholds
# Both must be green or the publish matrix never starts.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      patch:
        description: 'Release suffix, for example "1.0" or "1.0-beta.1". Publishes 19.<suffix> / 20.<suffix> / 21.<suffix>.'
        required: true
        type: string
      tag:
        description: 'npm dist-tag. angular19/20/21 are recovery tags that do not move latest.'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - latest
          - angular19
          - angular20
          - angular21
      major:
        description: 'Angular major to publish. Release tags always publish all three; select one only for recovery.'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - '19'
          - '20'
          - '21'
      publish_docs:
        description: 'Generate and commit the release API-doc archive after a manual recovery.'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  # Required by npm trusted publishing: lets the job mint the short-lived OIDC
  # token npm exchanges for publish rights, instead of a long-lived NPM_TOKEN.
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  verify-version-sync:
    name: Verify v19 rollout to v20/v21
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check generated version workspaces
        run: npm run check:sync

  test:
    name: Unit tests (v19)
    runs-on: ubuntu-latest
    # The suite is ~4.6k specs; it finishes in a couple of minutes. The cap only
    # exists so a wedged headless browser cannot burn a full job allowance.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: versions/v19/package-lock.json

      - name: Install dependencies
        # Same reasoning as the publish job: npm install (not npm ci) because the
        # checked-in lockfiles can lag behind the manifests after a sync rollout.
        run: npm install --legacy-peer-deps
        working-directory: versions/v19

      - name: Run the sdcorejs-angular test suite
        # --code-coverage is REQUIRED, not a nicety: the karma coverage thresholds
        # in projects/sdcorejs-angular/karma.conf.js are only evaluated when
        # coverage is collected, so without it the thresholds gate nothing.
        # ChromeHeadlessCI = ChromeHeadless + the usual CI sandbox flags (see karma.conf.js).
        # karma.conf.js prints the Jasmine random seed at the top of the run; quote it
        # when reporting a red run (replay caveat documented in that file).
        run: npx ng test sdcorejs-angular --watch=false --browsers=ChromeHeadlessCI --code-coverage
        working-directory: versions/v19

  build-and-publish:
    # Never publish a red suite. Both gates must pass before any npm publish runs.
    needs: [verify-version-sync, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # npm updates one package packument for all three versions. Concurrent PUTs
      # can race while the previous version is still being processed and return E409.
      max-parallel: 1
      matrix:
        include:
          - version: v19
            major: 19
          - version: v20
            major: 20
          - version: v21
            major: 21

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A manual recovery must rebuild the immutable release tree rather than
          # whatever commit happens to be current on main when the retry runs.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.patch) || github.ref }}

      - name: Ensure release tag is current main
        if: ${{ github.event_name == 'push' }}
        run: |
          git fetch origin main --depth=1
          TAG_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME must point at origin/main before npm publish."
            echo "tag=$TAG_SHA main=$MAIN_SHA"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0 (npm docs).
          node-version: 22
          cache: npm
          cache-dependency-path: versions/${{ matrix.version }}/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        # Node 22 still bundles npm 10.x; OIDC publishing needs npm >= 11.5.1.
        run: |
          npm install -g npm@latest
          npm --version

      - name: Resolve release suffix + npm dist-tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PATCH="${{ github.event.inputs.patch }}"
            TAG="${{ github.event.inputs.tag }}"
            REQUESTED_MAJOR="${{ github.event.inputs.major }}"
          else
            PATCH="${GITHUB_REF_NAME#v}"
            if echo "$PATCH" | grep -qE '(beta|alpha|rc)'; then TAG="beta"; else TAG="latest"; fi
            REQUESTED_MAJOR="all"
          fi
          if ! echo "$PATCH" | grep -qE '^[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$'; then
            echo "::error::Invalid release suffix '$PATCH'. Expected 1.0 or 1.0-beta.1."
            exit 1
          fi
          if ! echo "$TAG" | grep -qE '^(beta|latest|angular(19|20|21))$'; then
            echo "::error::Invalid npm dist-tag '$TAG'."
            exit 1
          fi
          if echo "$TAG" | grep -qE '^angular(19|20|21)$' && [ "$TAG" != "angular$REQUESTED_MAJOR" ]; then
            echo "::error::Recovery tag '$TAG' must match requested major '$REQUESTED_MAJOR'."
            exit 1
          fi
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${{ matrix.major }}.$PATCH" >> "$GITHUB_OUTPUT"

      - name: Write version into library package.json
        run: |
          PKG="projects/sdcorejs-angular/package.json"
          node -e "const fs=require('fs');const p='${PKG}';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='${{ steps.resolve.outputs.version }}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
          grep '"version"' "$PKG"
        working-directory: versions/${{ matrix.version }}

      - name: Install dependencies
        # npm install is intentional here. v20/v21 package-lock files can still
        # contain Angular 19 pins after sync, so npm ci would be too strict.
        run: npm install --legacy-peer-deps
        working-directory: versions/${{ matrix.version }}

      - name: Build library
        run: node --max_old_space_size=8000 ./node_modules/@angular/cli/bin/ng build sdcorejs-angular
        working-directory: versions/${{ matrix.version }}

      - name: Publish @sdcorejs/angular@${{ steps.resolve.outputs.version }} (tag=${{ steps.resolve.outputs.tag }})
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.major == 'all' || github.event.inputs.major == format('{0}', matrix.major) }}
        # No NODE_AUTH_TOKEN on purpose. npm authenticates through the OIDC
        # trusted publisher configured for this repository + workflow file; if a
        # token is present npm uses it instead and the package's 2FA policy
        # rejects it with "an automation token was specified".
        run: npm publish --access public --tag ${{ steps.resolve.outputs.tag }}
        working-directory: versions/${{ matrix.version }}/dist/sdcorejs-angular

  publish-docs:
    name: Publish versioned API docs
    needs: build-and-publish
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_docs) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Tag-triggered releases document the tag tree. A manual recovery starts
          # from main so its generated-doc commit remains a fast-forward push.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Ensure release tag is current main
        if: ${{ github.event_name == 'push' }}
        run: |
          git fetch origin main --depth=1
          TAG_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Docs are generated from the tag tree and committed to main. Tag $GITHUB_REF_NAME must point at origin/main."
            echo "tag=$TAG_SHA main=$MAIN_SHA"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve release suffix
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PATCH="${{ github.event.inputs.patch }}"
          else
            PATCH="${GITHUB_REF_NAME#v}"
          fi
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"

      - name: Generate published-docs for 19/20/21
        run: |
          RELEASE_DATE="$(date -u +%F)"
          npm run collect-release-docs -- --patch "${{ steps.resolve.outputs.patch }}" --date "$RELEASE_DATE" --skip-existing

      - name: Commit published-docs archive
        run: |
          if [ -z "$(git status --porcelain published-docs)" ]; then
            echo "No published-docs changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published-docs
          git commit -m "docs: publish API docs for v${{ steps.resolve.outputs.patch }}"
          git push origin HEAD:main
