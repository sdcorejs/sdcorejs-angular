name: Deploy published pages to GitHub Pages

# Assemble GitHub Pages from COMMITTED artifacts. This workflow runs NO Angular build.
#   published-pages/<suffix>/  one self-contained site per retained release
#   published-docs/<version>/  raw versioned API docs
# A new release page is produced locally/at release time by
# `npm run build:page -- --suffix <x.y>` and committed; see CLAUDE.md.
#
# Trigger:
#   - Push lên main khi published-pages/** hoặc published-docs/** đổi.
#   - Sau khi workflow publish npm xong (its docs commit uses GITHUB_TOKEN, which does
#     NOT trigger push workflows — hence the workflow_run trigger).
#   - Manual dispatch.
#
# Setup yêu cầu trong repo Settings > Pages:
#   Source = "GitHub Actions" (KHÔNG dùng branch source).

on:
  push:
    branches:
      - main
    # Only committed artifacts matter now — the deploy assembles, it does not build.
    # A showcase source change reaches Pages by building a new published-pages/<suffix>/.
    paths:
      - 'published-pages/**'
      - 'published-docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_run:
    workflows:
      - 'Publish @sdcorejs/angular to npm'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify committed page artifacts
        # There is no Angular build here. Each release suffix under published-pages/ was built
        # and committed by `npm run build:page -- --suffix <x.y>`, so the deploy is a pure copy.
        run: |
          if [ ! -d published-pages ]; then
            echo "::error::published-pages/ is missing. Build a release page first: npm run build:page -- --suffix <x.y>"
            exit 1
          fi
          LATEST=$(node -e "process.stdout.write(require('./published-pages/pages.json').latest || '')")
          if [ -z "$LATEST" ] || [ ! -d "published-pages/$LATEST" ]; then
            echo "::error::published-pages/pages.json latest=\"$LATEST\" does not resolve to a directory."
            exit 1
          fi
          echo "latest=$LATEST" >> "$GITHUB_ENV"
          echo "Pages: latest=$LATEST · suffixes: $(ls published-pages | grep -v '\.json$' | tr '\n' ' ')"

      - name: Assemble Pages site
        # Layout served at https://sdcorejs.github.io/sdcorejs-angular/
        #   /<suffix>/        one self-contained site per retained release
        #   /                 redirect to the newest suffix
        #   /latest/          redirect to the newest suffix
        #   /docs/**          raw versioned API docs for AI agents (served before the SPA fallback)
        run: |
          set -euo pipefail
          SITE=_site
          rm -rf "$SITE"
          mkdir -p "$SITE"

          for dir in published-pages/*/; do
            suffix=$(basename "$dir")
            cp -R "$dir" "$SITE/$suffix"
          done
          cp published-pages/pages.json "$SITE/pages.json"

          DOCS="$SITE/docs"
          mkdir -p "$DOCS"
          cp -R published-docs/. "$DOCS"/
          DOCS_LATEST=$(node -e "process.stdout.write(require('./published-docs/versions.json').latest || '')")
          if [ -n "$DOCS_LATEST" ] && [ -d "$DOCS/$DOCS_LATEST" ]; then
            rm -rf "$DOCS/latest"
            cp -R "$DOCS/$DOCS_LATEST" "$DOCS/latest"
          fi

          # why: a redirect instead of a second full copy — an extra page copy is ~26MB and
          # counts against the 1GB Pages limit.
          redirect() {
            printf '<!doctype html><meta charset="utf-8"><title>Redirecting</title>' > "$1"
            printf '<link rel="canonical" href="/sdcorejs-angular/%s/">' "$latest" >> "$1"
            printf '<meta http-equiv="refresh" content="0; url=/sdcorejs-angular/%s/">' "$latest" >> "$1"
            printf '<script>location.replace("/sdcorejs-angular/%s/" + location.hash)</script>' "$latest" >> "$1"
          }
          redirect "$SITE/index.html"
          redirect "$SITE/404.html"
          mkdir -p "$SITE/latest"
          redirect "$SITE/latest/index.html"

          echo "Assembled: $(find "$SITE" -type f | wc -l) files, $(du -sh "$SITE" | cut -f1)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
