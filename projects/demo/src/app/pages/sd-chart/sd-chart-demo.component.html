<div class="demo-container">
  <h2>Bar Chart Demo</h2>
  <div class="chart-container">
    <sd-bar-chart [data]="barChartData" [options]="barChartOptions"></sd-bar-chart>
  </div>

  <h2>Line Chart Demo</h2>
  <div class="chart-container">
    <sd-line-chart [data]="lineChartData" [options]="barChartOptions"></sd-line-chart>
  </div>

  <h2>Pie Chart Demo</h2>
  <div class="chart-container">
    <sd-pie-chart [data]="pieChartData" [options]="{ responsive: true, maintainAspectRatio: false }"></sd-pie-chart>
  </div>
</div>
