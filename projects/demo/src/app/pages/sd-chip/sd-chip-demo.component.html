<!-- START: sd-chip -->
<div style="padding: 32px; max-width: 1400px; font-family: sans-serif">

  <!-- Section 1: Basic -->
  <h2>1. Trạng thái cơ bản</h2>
  <div style="display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 40px">
    <div style="width: 400px">
      <h4>Size md</h4>
      <div style="margin-bottom: 16px">
        <sd-chip label="Normal (có chip)" placeholder="Nhập rồi Enter..." helperText="Helper text"
          [(model)]="chips" [form]="form" required></sd-chip>
      </div>
      <div style="margin-bottom: 16px">
        <sd-chip label="Disabled" [(model)]="chipsDisabled" [form]="form" disabled></sd-chip>
      </div>
    </div>
    <div style="width: 400px">
      <h4>Size sm</h4>
      <div style="margin-bottom: 16px">
        <sd-chip label="Normal (có chip)" size="sm" placeholder="Nhập rồi Enter..."
          [(model)]="chipsSm" [form]="form" required></sd-chip>
      </div>
      <div style="margin-bottom: 16px">
        <sd-chip label="Disabled" size="sm" [(model)]="chipsSmDisabled" [form]="form" disabled></sd-chip>
      </div>
    </div>
  </div>

  <!-- Section 2: Validation inline -->
  <h2>2. Validation — Inline Error</h2>
  <div style="display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px">
    <div style="width: 400px">
      <h4>Size md</h4>
      <div style="margin-bottom: 16px">
        <sd-chip label="Required (xoá hết chip → lỗi)" placeholder="Nhập rồi Enter..."
          [(model)]="v_required" [form]="formValidation" required></sd-chip>
      </div>
      <div style="margin-bottom: 16px">
        <sd-chip label="Min 3 chip (mới có 1 → lỗi)" placeholder="Nhập rồi Enter..."
          [(model)]="v_min" [form]="formValidation" [min]="3"></sd-chip>
      </div>
    </div>
    <div style="width: 400px">
      <h4>Size sm</h4>
      <div style="margin-bottom: 16px">
        <sd-chip label="Required" size="sm" placeholder="Nhập rồi Enter..."
          [(model)]="v_required" [form]="formValidation" required></sd-chip>
      </div>
      <div style="margin-bottom: 16px">
        <sd-chip label="Min 3 chip" size="sm" placeholder="Nhập rồi Enter..."
          [(model)]="v_min" [form]="formValidation" [min]="3"></sd-chip>
      </div>
    </div>
  </div>
  <div style="margin-bottom: 40px">
    <button mat-stroked-button (click)="validateSection()">Validate tất cả</button>
    <button mat-stroked-button (click)="resetSection()" style="margin-left: 8px">Reset</button>
  </div>

  <!-- Section 3: Hide inline error -->
  <h2>3. Validation — Hide Inline Error (icon + tooltip)</h2>
  <p style="color: #666; margin-bottom: 16px">Hover vào icon 🔴 để xem nội dung lỗi.</p>
  <div style="display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px">
    <div style="width: 400px">
      <h4>Size md</h4>
      <div style="margin-bottom: 16px">
        <sd-chip label="Required + hideInlineError" placeholder="Nhập rồi Enter..."
          [(model)]="h_required" [form]="formHide" required hideInlineError></sd-chip>
      </div>
      <div style="margin-bottom: 16px">
        <sd-chip label="Min 3 + hideInlineError" placeholder="Nhập rồi Enter..."
          [(model)]="h_min" [form]="formHide" [min]="3" hideInlineError></sd-chip>
      </div>
    </div>
    <div style="width: 400px">
      <h4>Size sm</h4>
      <div style="margin-bottom: 16px">
        <sd-chip label="Required + hideInlineError" size="sm" placeholder="Nhập rồi Enter..."
          [(model)]="h_required" [form]="formHide" required hideInlineError></sd-chip>
      </div>
      <div style="margin-bottom: 16px">
        <sd-chip label="Min 3 + hideInlineError" size="sm" placeholder="Nhập rồi Enter..."
          [(model)]="h_min" [form]="formHide" [min]="3" hideInlineError></sd-chip>
      </div>
    </div>
  </div>
  <div style="margin-bottom: 40px">
    <button mat-stroked-button (click)="validateHide()">Validate tất cả</button>
    <button mat-stroked-button (click)="resetHide()" style="margin-left: 8px">Reset</button>
  </div>

</div>
<!-- END: sd-chip -->
