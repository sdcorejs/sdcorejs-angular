<!-- START: sd-textarea -->
<div style="padding: 32px; max-width: 1400px; font-family: sans-serif">

  <!-- =========================================== -->
  <!-- SECTION 1: Trạng thái cơ bản               -->
  <!-- =========================================== -->
  <h2>1. Trạng thái cơ bản (Basic States)</h2>
  <div style="display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 40px">
    <div style="width: 360px">
      <h4>Size md</h4>
      <div style="margin-bottom: 16px">
        <sd-textarea label="Normal (required)" placeholder="Nhập nội dung..." helperText="Đây là helper text" [(model)]="basicModel" [form]="form" required></sd-textarea>
      </div>
      <div style="margin-bottom: 16px">
        <sd-textarea label="Disabled" [(model)]="disabledModel" [form]="form" disabled></sd-textarea>
      </div>
      <div style="margin-bottom: 16px">
        <sd-textarea label="Readonly" [(model)]="readonlyModel" [form]="form" readonly></sd-textarea>
      </div>
    </div>
    <div style="width: 360px">
      <h4>Size sm</h4>
      <div style="margin-bottom: 16px">
        <sd-textarea label="Normal (required)" size="sm" placeholder="Nhập nội dung..." helperText="Đây là helper text" [(model)]="basicModel" [form]="form" required></sd-textarea>
      </div>
      <div style="margin-bottom: 16px">
        <sd-textarea label="Disabled" size="sm" [(model)]="disabledModel" [form]="form" disabled></sd-textarea>
      </div>
      <div style="margin-bottom: 16px">
        <sd-textarea label="Readonly" size="sm" [(model)]="readonlyModel" [form]="form" readonly></sd-textarea>
      </div>
    </div>
  </div>

  <!-- =========================================== -->
  <!-- SECTION 2: Validation — Inline Error        -->
  <!-- =========================================== -->
  <h2>2. Validation — Inline Error (mặc định)</h2>
  <div style="display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px">
    <div style="width: 360px">
      <h4>Size md</h4>
      <div style="margin-bottom: 16px">
        <sd-textarea label="Required" placeholder="Để trống → lỗi" [(model)]="v_required" [form]="formValidation" required></sd-textarea>
      </div>
      <div style="margin-bottom: 16px">
        <sd-textarea label="Maxlength 50" placeholder="Nhập quá 50 ký tự → lỗi" [(model)]="v_maxlength" [form]="formValidation" [maxlength]="50"></sd-textarea>
      </div>
      <div style="margin-bottom: 16px">
        <sd-textarea label="Inline Error" placeholder="Nhập gì cũng lỗi" [(model)]="v_inline" [form]="formValidation" inlineError="Lỗi do backend trả về"></sd-textarea>
      </div>
    </div>
    <div style="width: 360px">
      <h4>Size sm</h4>
      <div style="margin-bottom: 16px">
        <sd-textarea label="Required" size="sm" placeholder="Để trống → lỗi" [(model)]="v_required" [form]="formValidation" required></sd-textarea>
      </div>
      <div style="margin-bottom: 16px">
        <sd-textarea label="Maxlength 50" size="sm" placeholder="Nhập quá 50 ký tự → lỗi" [(model)]="v_maxlength" [form]="formValidation" [maxlength]="50"></sd-textarea>
      </div>
      <div style="margin-bottom: 16px">
        <sd-textarea label="Inline Error" size="sm" placeholder="Nhập gì cũng lỗi" [(model)]="v_inline" [form]="formValidation" inlineError="Lỗi do backend trả về"></sd-textarea>
      </div>
    </div>
  </div>
  <div style="margin-bottom: 40px">
    <button mat-stroked-button (click)="validateSection()">Validate tất cả</button>
    <button mat-stroked-button (click)="resetSection()" style="margin-left: 8px">Reset</button>
  </div>

  <!-- =========================================== -->
  <!-- SECTION 3: Validation — Hide Inline Error   -->
  <!-- =========================================== -->
  <h2>3. Validation — Hide Inline Error (icon + tooltip)</h2>
  <p style="color: #666; margin-bottom: 16px">Lỗi hiển thị qua icon 🔴 ở cuối input. Hover để xem nội dung lỗi.</p>
  <div style="display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px">
    <div style="width: 360px">
      <h4>Size md</h4>
      <div style="margin-bottom: 16px">
        <sd-textarea label="Required + hideInlineError" placeholder="Để trống → icon lỗi" [(model)]="h_required" [form]="formHide" required hideInlineError></sd-textarea>
      </div>
      <div style="margin-bottom: 16px">
        <sd-textarea label="Maxlength 20 + hideInlineError" placeholder="Nhập quá 20 ký tự → icon lỗi" [(model)]="h_maxlength" [form]="formHide" [maxlength]="20" hideInlineError></sd-textarea>
      </div>
      <div style="margin-bottom: 16px">
        <sd-textarea label="Inline Error + hideInlineError" placeholder="Nhập gì cũng lỗi" [(model)]="h_inline" [form]="formHide" inlineError="Lỗi backend" hideInlineError></sd-textarea>
      </div>
    </div>
    <div style="width: 360px">
      <h4>Size sm</h4>
      <div style="margin-bottom: 16px">
        <sd-textarea label="Required + hideInlineError" size="sm" placeholder="Để trống → icon lỗi" [(model)]="h_required" [form]="formHide" required hideInlineError></sd-textarea>
      </div>
      <div style="margin-bottom: 16px">
        <sd-textarea label="Maxlength 20 + hideInlineError" size="sm" placeholder="Nhập quá 20 ký tự → icon lỗi" [(model)]="h_maxlength" [form]="formHide" [maxlength]="20" hideInlineError></sd-textarea>
      </div>
      <div style="margin-bottom: 16px">
        <sd-textarea label="Inline Error + hideInlineError" size="sm" placeholder="Nhập gì cũng lỗi" [(model)]="h_inline" [form]="formHide" inlineError="Lỗi backend" hideInlineError></sd-textarea>
      </div>
    </div>
  </div>
  <div style="margin-bottom: 40px">
    <button mat-stroked-button (click)="validateHide()">Validate tất cả</button>
    <button mat-stroked-button (click)="resetHide()" style="margin-left: 8px">Reset</button>
  </div>

</div>
<!-- END: sd-textarea -->
