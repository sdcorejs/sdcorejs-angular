<sd-section class="mt-8" title="Thông tin chung" icon="info">
  <attribute-template [component]="component" (sdChange)="onChangeTemplate($event)"></attribute-template>
  <attribute-input [form]="form" label="Trường dữ liệu" [(model)]="component.key" [disabled]="!!component.template"></attribute-input>
  <attribute-input label="Tên hiển thị" [(model)]="component.label"></attribute-input>
  <attribute-select
    label="Định dạng"
    [(model)]="component.subtype"
    [items]="[
      { value: 'date', display: 'dd/MM/yyyy' },
      { value: 'datetime', display: 'dd/MM/yyyy HH:mm' }
    ]"></attribute-select>
  <attribute-textarea [form]="form" label="Gợi ý" [(model)]="component.helperText"></attribute-textarea>
</sd-section>
@if (!component.properties!.hidden && !component.properties!.viewed) {
  <sd-section class="mt-8" title="Hiển thị" icon="visibility">
    <attribute-switch [form]="form" label="Vô hiệu" [(model)]="component.disabled"></attribute-switch>
    <attribute-expression
      label="Hiển thị khi"
      [components]="components"
      [variables]="variables"
      [(model)]="component.properties!.visibleWhenExpression"></attribute-expression>
    <attribute-expression
      label="Ẩn khi"
      [components]="components"
      [variables]="variables"
      [(model)]="component.properties!.hiddenWhenExpression"></attribute-expression>
    @if (!component.disabled) {
      <attribute-expression
        label="Vô hiệu khi"
        [components]="components"
        [variables]="variables"
        [(model)]="component.properties!.disabledWhenExpression"></attribute-expression>
    }
  </sd-section>
  <sd-section class="mt-8" title="Ràng buộc" icon="verified_user">
    <attribute-switch [form]="form" label="Bắt buộc" [(model)]="component.validate!.required"></attribute-switch>
    @if (!component.validate!.required) {
      <attribute-expression
        label="Bắt buộc khi"
        [components]="components"
        [variables]="variables"
        [(model)]="component.properties!.requiredWhenExpression"></attribute-expression>
    }
  </sd-section>
}
