@if (component.properties?.viewed) {
  <div class="d-block T12R text-secondary">
    {{ component.label }}
  </div>
  <div class="T14M">Your dropdown selection</div>
} @else {
  <div class="d-block mb-0 T14M">
    {{ component.label }}
    @if (component.validate?.required) {
      <span class="text-error mb-2">*</span>
    }
  </div>
  <div class="d-flex align-items-center">
    <div class="c-input c-select">
      <svg width="8" height="8">
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          fill="currentColor"
          stroke="currentColor"
          stroke-width=".5"
          d="M7.75 1.336L4 6.125.258 1.335 0 1.54l4 5.125L8 1.54zm0 0"></path>
      </svg>
    </div>
  </div>
}
