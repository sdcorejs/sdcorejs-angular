<!-- START: sd-input-number -->
<div style="padding: 32px; max-width: 1400px; font-family: sans-serif">

  <!-- =========================================== -->
  <!-- SECTION 1: Trạng thái cơ bản               -->
  <!-- =========================================== -->
  <h2>1. Trạng thái cơ bản (Basic States)</h2>
  <div style="display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 40px">
    <div style="width: 360px">
      <h4>Size md</h4>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Normal (required)" placeholder="Nhập số..." helperText="Đây là helper text" [(model)]="basicModel" [form]="form" required></sd-input-number>
      </div>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Disabled" [(model)]="disabledModel" [form]="form" disabled></sd-input-number>
      </div>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Readonly" [(model)]="readonlyModel" [form]="form" readonly></sd-input-number>
      </div>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Viewed" [(model)]="viewedModel" [form]="form" viewed></sd-input-number>
      </div>
    </div>
    <div style="width: 360px">
      <h4>Size sm</h4>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Normal (required)" size="sm" placeholder="Nhập số..." helperText="Đây là helper text" [(model)]="basicModel" [form]="form" required></sd-input-number>
      </div>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Disabled" size="sm" [(model)]="disabledModel" [form]="form" disabled></sd-input-number>
      </div>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Readonly" size="sm" [(model)]="readonlyModel" [form]="form" readonly></sd-input-number>
      </div>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Viewed" size="sm" [(model)]="viewedModel" [form]="form" viewed></sd-input-number>
      </div>
    </div>
  </div>

  <!-- =========================================== -->
  <!-- SECTION 2: Validation — Inline Error        -->
  <!-- =========================================== -->
  <h2>2. Validation — Inline Error (mặc định)</h2>
  <div style="display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px">
    <div style="width: 360px">
      <h4>Size md</h4>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Required" placeholder="Để trống → lỗi" [(model)]="v_required" [form]="formValidation" required></sd-input-number>
      </div>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Min 10" placeholder="Nhập dưới 10 → lỗi" [(model)]="v_min" [form]="formValidation" [min]="10"></sd-input-number>
      </div>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Max 100" placeholder="Nhập quá 100 → lỗi" [(model)]="v_max" [form]="formValidation" [max]="100"></sd-input-number>
      </div>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Inline Error" placeholder="Nhập gì cũng lỗi" [(model)]="v_inline" [form]="formValidation" inlineError="Giá trị không hợp lệ"></sd-input-number>
      </div>
    </div>
    <div style="width: 360px">
      <h4>Size sm</h4>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Required" size="sm" placeholder="Để trống → lỗi" [(model)]="v_required" [form]="formValidation" required></sd-input-number>
      </div>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Min 10" size="sm" placeholder="Nhập dưới 10 → lỗi" [(model)]="v_min" [form]="formValidation" [min]="10"></sd-input-number>
      </div>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Max 100" size="sm" placeholder="Nhập quá 100 → lỗi" [(model)]="v_max" [form]="formValidation" [max]="100"></sd-input-number>
      </div>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Inline Error" size="sm" placeholder="Nhập gì cũng lỗi" [(model)]="v_inline" [form]="formValidation" inlineError="Giá trị không hợp lệ"></sd-input-number>
      </div>
    </div>
  </div>
  <div style="margin-bottom: 40px">
    <button mat-stroked-button (click)="validateSection()">Validate tất cả</button>
    <button mat-stroked-button (click)="resetSection()" style="margin-left: 8px">Reset</button>
  </div>

  <!-- =========================================== -->
  <!-- SECTION 3: Validation — Hide Inline Error   -->
  <!-- =========================================== -->
  <h2>3. Validation — Hide Inline Error (icon + tooltip)</h2>
  <p style="color: #666; margin-bottom: 16px">Lỗi hiển thị qua icon 🔴 ở cuối input. Hover để xem nội dung lỗi.</p>
  <div style="display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px">
    <div style="width: 360px">
      <h4>Size md</h4>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Required + hideInlineError" placeholder="Để trống → icon lỗi" [(model)]="h_required" [form]="formHide" required hideInlineError></sd-input-number>
      </div>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Min 10 + hideInlineError" placeholder="Nhập dưới 10 → icon lỗi" [(model)]="h_min" [form]="formHide" [min]="10" hideInlineError></sd-input-number>
      </div>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Max 100 + hideInlineError" placeholder="Nhập quá 100 → icon lỗi" [(model)]="h_max" [form]="formHide" [max]="100" hideInlineError></sd-input-number>
      </div>
    </div>
    <div style="width: 360px">
      <h4>Size sm</h4>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Required + hideInlineError" size="sm" placeholder="Để trống → icon lỗi" [(model)]="h_required" [form]="formHide" required hideInlineError></sd-input-number>
      </div>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Min 10 + hideInlineError" size="sm" placeholder="Nhập dưới 10 → icon lỗi" [(model)]="h_min" [form]="formHide" [min]="10" hideInlineError></sd-input-number>
      </div>
      <div style="margin-bottom: 16px">
        <sd-input-number label="Max 100 + hideInlineError" size="sm" placeholder="Nhập quá 100 → icon lỗi" [(model)]="h_max" [form]="formHide" [max]="100" hideInlineError></sd-input-number>
      </div>
    </div>
  </div>
  <div style="margin-bottom: 40px">
    <button mat-stroked-button (click)="validateHide()">Validate tất cả</button>
    <button mat-stroked-button (click)="resetHide()" style="margin-left: 8px">Reset</button>
  </div>

</div>
<!-- END: sd-input-number -->
