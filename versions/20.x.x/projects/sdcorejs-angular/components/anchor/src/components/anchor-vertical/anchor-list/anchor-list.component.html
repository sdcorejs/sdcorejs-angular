<div
  class="c-anchor-list"
  [style.width]="width">
  @for (section of sections; track section.id) {
    <div
      [class.active]="section.id === activeId"
      [attr.data-sd-anchor-list-id]="section.id"
      (click)="onTabClick(section)"
      (keydown.enter)="onTabClick(section)"
      tabindex="0"
      class="c-anchor-list-item">
      @if (section.icon) {
        <mat-icon class="c-anchor-list-item-icon">{{ section.icon }}</mat-icon>
      }
      <div
        class="c-anchor-list-item-text"
        [ngClass]="{
          ellipsis
        }">
        {{ section.title }}
      </div>
    </div>
  }
</div>
