@let item = field();
<sd-radio
  [form]="form()"
  [label]="item.label || item.key"
  [name]="item.key"
  [autoId]="item.key"
  [model]="value()"
  (modelChange)="select($event)"
  [required]="required()"
  [disabled]="disabled()"
  [items]="items()"
  valueField="value"
  displayField="label"
  [display]="item.direction || 'row'"
  [viewed]="viewed()"
  [hyperlink]="item.hyperlink | hyperlink: scope()"></sd-radio>
