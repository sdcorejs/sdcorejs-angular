@if (entity && component) {
  <sd-radio
    [form]="form"
    [label]="component.label || component.key"
    [name]="component.key"
    [autoId]="component.key"
    [(model)]="entity[component.key!]"
    [required]="required"
    [disabled]="disabled"
    [items]="items"
    valueField="value"
    displayField="display"
    [display]="component.properties?.direction"
    [viewed]="viewed || component.properties?.viewed"
    [hyperlink]="component.properties?.hyperlink | hyperlink: entity"></sd-radio>
}
