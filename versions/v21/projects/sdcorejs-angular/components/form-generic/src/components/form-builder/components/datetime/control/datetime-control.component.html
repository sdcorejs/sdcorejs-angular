@if (component.properties?.viewed) {
  <div class="d-block T12R text-secondary">
    {{ component.label }}
  </div>
  <div class="T14M">{{ component.subtype === 'datetime' ? datetime : date }}</div>
} @else {
  <div class="d-block mb-0 T14M">
    {{ component.label }}
    @if (component.validate?.required) {
      <span class="text-error mb-2">*</span>
    }
  </div>
  <div class="d-flex align-items-center">
    <div class="c-input">
      <svg viewBox="0 0 24 24" width="24px" height="24px" fill="currentColor" focusable="false">
        <path
          d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"></path>
      </svg>
    </div>
  </div>
}
