<!--
  Seamless string/number chip — the pill IS the input. One border, three flush
  segments: label · input(s) · ×. State styling driven by [data-state]. The value
  field is the shared <sd-inline-text> primitive (chrome="seamless") so width hugs
  content; the chip keeps the envelope + parse/commit logic.
-->
<span
  class="c-seamless"
  [attr.data-state]="state()"
  [class.c-seamless--compact]="density() === 'compact'"
  [class.c-seamless--comfortable]="density() === 'comfortable'"
  (click)="focusFromShell($event)">

  <!-- Label segment: icon + field name (+ optional operator pill) -->
  <span class="c-seamless__label">
    <mat-icon class="c-seamless__icon" fontSet="material-icons-outlined">{{ icon() }}</mat-icon>
    <span class="c-seamless__field">{{ field().label }}</span>
    @if (showOperator() && !isNoData()) {
      <sd-operator class="c-seamless__op" [operators]="[operator()]" [model]="operator()" [disabled]="true" />
    } @else if (!isNoData()) {
      <span class="c-seamless__sep">:</span>
    }
  </span>

  <!-- Input segment — seamless borderless primitive; hidden for NULL / NOT_NULL -->
  @if (!isNoData()) {
    <span class="c-seamless__input">
      @if (isBetween()) {
        <sd-inline-text
          #firstInput
          chrome="seamless"
          [clearable]="false"
          [autofocus]="autofocus()"
          [state]="state()"
          [value]="draftFrom()"
          (valueChange)="draftFrom.set($event)"
          [placeholder]="phFrom()"
          [autoId]="autoId() ? autoId() + '-from' : undefined"
          (sdFocus)="onFocus()"
          (sdBlur)="commitRange()"
          (keyupEnter)="firstInput.blur()"
          (keydownEscape)="revertAndBlur(firstInput)" />
        <span class="c-seamless__dash" aria-hidden="true">—</span>
        <sd-inline-text
          #secondInput
          chrome="seamless"
          [clearable]="false"
          [state]="state()"
          [value]="draftTo()"
          (valueChange)="draftTo.set($event)"
          [placeholder]="phTo()"
          [autoId]="autoId() ? autoId() + '-to' : undefined"
          (sdFocus)="onFocus()"
          (sdBlur)="commitRange()"
          (keyupEnter)="secondInput.blur()"
          (keydownEscape)="revertAndBlur(secondInput)" />
      } @else {
        <sd-inline-text
          #firstInput
          chrome="seamless"
          [clearable]="false"
          [autofocus]="autofocus()"
          [state]="state()"
          [value]="draft()"
          (valueChange)="draft.set($event)"
          [placeholder]="ph()"
          [autoId]="autoId() ?? undefined"
          (sdFocus)="onFocus()"
          (sdBlur)="commitSingle()"
          (keyupEnter)="firstInput.blur()"
          (keydownEscape)="revertAndBlur(firstInput)" />
      }
    </span>
  }

  <!-- × segment -->
  <button type="button" class="c-seamless__x" aria-label="Remove filter" (click)="onRemove($event)">
    <mat-icon fontSet="material-icons-outlined">close</mat-icon>
  </button>
</span>
