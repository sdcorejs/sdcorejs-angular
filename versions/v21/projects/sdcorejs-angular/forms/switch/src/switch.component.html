@let _label = label();
@if (isViewed()) {
  @if (_label) {
    <div class="sd-view-label T14R">{{ _label }}</div>
  }
  <div class="sd-view-value T14M">{{ (model() ? 'core.form.switch.on' : 'core.form.switch.off') | sdTranslate }}</div>
} @else {
  <mat-slide-toggle
    [formControl]="formControl"
    [attr.data-autoId]="autoId()"
    [attr.data-disabled]="dataDisabled()"
    [attr.data-empty]="dataEmpty()"
    [attr.data-value]="dataValue()"
    [attr.data-required]="dataRequired()">
    <sd-label [label]="_label" [required]="required()"></sd-label>
  </mat-slide-toggle>
  @let _errorMessage = visibleErrorMessage();
  @if (_errorMessage) {
    <mat-error>{{ _errorMessage }}</mat-error>
  }
}
