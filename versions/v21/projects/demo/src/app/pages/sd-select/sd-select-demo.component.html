<!-- START: sd-select + sd-autocomplete -->
<div style="padding: 32px; max-width: 1400px; font-family: sans-serif">

  <!-- =========================================== -->
  <!-- sd-select                                   -->
  <!-- =========================================== -->
  <h1>sd-select</h1>

  <h2>1. Trạng thái cơ bản</h2>
  <div style="display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 40px">
    <div style="width: 360px">
      <h4>Size md</h4>
      <div style="margin-bottom: 16px">
        <sd-select [items]="items" valueField="value" displayField="display" label="Normal (required)" helperText="Helper text" [(model)]="selectModel" [form]="form" required></sd-select>
      </div>
      <div style="margin-bottom: 16px">
        <sd-select [items]="items" valueField="value" displayField="display" label="Disabled" [(model)]="selectDisabled" [form]="form" disabled></sd-select>
      </div>
    </div>
    <div style="width: 360px">
      <h4>Size sm</h4>
      <div style="margin-bottom: 16px">
        <sd-select [items]="items" valueField="value" displayField="display" label="Normal (required)" size="sm" helperText="Helper text" [(model)]="selectModel" [form]="form" required></sd-select>
      </div>
      <div style="margin-bottom: 16px">
        <sd-select [items]="items" valueField="value" displayField="display" label="Disabled" size="sm" [(model)]="selectDisabled" [form]="form" disabled></sd-select>
      </div>
    </div>
  </div>

  <h2>2. Validation — Inline Error</h2>
  <div style="display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px">
    <div style="width: 360px">
      <h4>Size md</h4>
      <div style="margin-bottom: 16px">
        <sd-select [items]="items" valueField="value" displayField="display" label="Required" placeholder="Chọn một giá trị" [(model)]="sv_required" [form]="formValidation" required></sd-select>
      </div>
      <div style="margin-bottom: 16px">
        <sd-select [items]="items" valueField="value" displayField="display" label="Inline Error" placeholder="Chọn gì cũng lỗi" [(model)]="sv_inline" [form]="formValidation" inlineError="Giá trị không hợp lệ"></sd-select>
      </div>
    </div>
    <div style="width: 360px">
      <h4>Size sm</h4>
      <div style="margin-bottom: 16px">
        <sd-select [items]="items" valueField="value" displayField="display" label="Required" size="sm" placeholder="Chọn một giá trị" [(model)]="sv_required" [form]="formValidation" required></sd-select>
      </div>
      <div style="margin-bottom: 16px">
        <sd-select [items]="items" valueField="value" displayField="display" label="Inline Error" size="sm" placeholder="Chọn gì cũng lỗi" [(model)]="sv_inline" [form]="formValidation" inlineError="Giá trị không hợp lệ"></sd-select>
      </div>
    </div>
  </div>
  <div style="margin-bottom: 40px">
    <button mat-stroked-button (click)="validateSection()">Validate</button>
    <button mat-stroked-button (click)="resetSection()" style="margin-left: 8px">Reset</button>
  </div>

  <h2>3. Validation — Hide Inline Error</h2>
  <p style="color: #666; margin-bottom: 16px">Hover vào icon 🔴 để xem nội dung lỗi.</p>
  <div style="display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px">
    <div style="width: 360px">
      <h4>Size md</h4>
      <div style="margin-bottom: 16px">
        <sd-select [items]="items" valueField="value" displayField="display" label="Required + hideInlineError" placeholder="Chọn một giá trị" [(model)]="sh_required" [form]="formHide" required hideInlineError></sd-select>
      </div>
      <div style="margin-bottom: 16px">
        <sd-select [items]="items" valueField="value" displayField="display" label="Inline Error + hideInlineError" placeholder="Chọn gì cũng lỗi" [(model)]="sh_inline" [form]="formHide" inlineError="Lỗi backend" hideInlineError></sd-select>
      </div>
    </div>
    <div style="width: 360px">
      <h4>Size sm</h4>
      <div style="margin-bottom: 16px">
        <sd-select [items]="items" valueField="value" displayField="display" label="Required + hideInlineError" size="sm" placeholder="Chọn một giá trị" [(model)]="sh_required" [form]="formHide" required hideInlineError></sd-select>
      </div>
      <div style="margin-bottom: 16px">
        <sd-select [items]="items" valueField="value" displayField="display" label="Inline Error + hideInlineError" size="sm" placeholder="Chọn gì cũng lỗi" [(model)]="sh_inline" [form]="formHide" inlineError="Lỗi backend" hideInlineError></sd-select>
      </div>
    </div>
  </div>
  <div style="margin-bottom: 60px">
    <button mat-stroked-button (click)="validateHide()">Validate</button>
    <button mat-stroked-button (click)="resetHide()" style="margin-left: 8px">Reset</button>
  </div>

  <hr style="margin-bottom: 40px">

  <!-- =========================================== -->
  <!-- sd-autocomplete                             -->
  <!-- =========================================== -->
  <h1>sd-autocomplete</h1>

  <h2>1. Trạng thái cơ bản</h2>
  <div style="display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 40px">
    <div style="width: 360px">
      <h4>Size md</h4>
      <div style="margin-bottom: 16px">
        <sd-autocomplete [items]="items" valueField="value" displayField="display" label="Normal (required)" helperText="Helper text" [(model)]="acModel" [form]="form" required></sd-autocomplete>
      </div>
      <div style="margin-bottom: 16px">
        <sd-autocomplete [items]="items" valueField="value" displayField="display" label="Disabled" [(model)]="acDisabled" [form]="form" disabled></sd-autocomplete>
      </div>
    </div>
    <div style="width: 360px">
      <h4>Size sm</h4>
      <div style="margin-bottom: 16px">
        <sd-autocomplete [items]="items" valueField="value" displayField="display" label="Normal (required)" size="sm" helperText="Helper text" [(model)]="acModel" [form]="form" required></sd-autocomplete>
      </div>
      <div style="margin-bottom: 16px">
        <sd-autocomplete [items]="items" valueField="value" displayField="display" label="Disabled" size="sm" [(model)]="acDisabled" [form]="form" disabled></sd-autocomplete>
      </div>
    </div>
  </div>

  <h2>2. Validation — Hide Inline Error</h2>
  <div style="display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px">
    <div style="width: 360px">
      <h4>Size md</h4>
      <div style="margin-bottom: 16px">
        <sd-autocomplete [items]="items" valueField="value" displayField="display" label="Required + hideInlineError" placeholder="Tìm kiếm..." [(model)]="ah_required" [form]="formHide2" required hideInlineError></sd-autocomplete>
      </div>
    </div>
    <div style="width: 360px">
      <h4>Size sm</h4>
      <div style="margin-bottom: 16px">
        <sd-autocomplete [items]="items" valueField="value" displayField="display" label="Required + hideInlineError" size="sm" placeholder="Tìm kiếm..." [(model)]="ah_required" [form]="formHide2" required hideInlineError></sd-autocomplete>
      </div>
    </div>
  </div>
  <div style="margin-bottom: 40px">
    <button mat-stroked-button (click)="validateHide2()">Validate</button>
    <button mat-stroked-button (click)="resetHide2()" style="margin-left: 8px">Reset</button>
  </div>

</div>
<!-- END: sd-select + sd-autocomplete -->
