<sd-section [title]="'core.module.generic.configuration.section.upsert' | sdTranslate">
  <p class="cfg-hint T14R">{{ 'core.module.generic.configuration.upsert-hint' | sdTranslate }}</p>
  <div class="cfg-body cfg-fields">
    <sd-select
      size="sm"
      hideInlineError
      valueField="value"
      displayField="display"
      [label]="'core.module.generic.field.upsert-key' | sdTranslate"
      [items]="upsertOptions()"
      [model]="schema().import?.upsertKey"
      (modelChange)="setUpsertKey($event)"></sd-select>
  </div>
</sd-section>

<sd-section [title]="'core.module.generic.configuration.section.import-columns' | sdTranslate">
  <div class="cfg-body cfg-rows cfg-rows--import">
    @for (row of rows(); track row.property.key) {
      <div class="cfg-row" role="group" [attr.aria-label]="row.property.label" [attr.data-autoId]="'generic-import-' + row.property.key">
        <sd-checkbox [label]="row.property.label" [model]="row.selected" (modelChange)="toggle(row.property.key, $event)"></sd-checkbox>
        <span class="cfg-key__type">{{ row.property.dataType }}{{ row.property.multiple ? '[]' : '' }}</span>
        @if (row.selected && row.property.dataType === 'relation') {
          <sd-input
            size="sm"
            hideInlineError
            [label]="'core.module.generic.field.match-field' | sdTranslate"
            [model]="row.matchField"
            (modelChange)="setMatchField(row.property.key, $event)"></sd-input>
        } @else {
          <span></span>
        }
      </div>
    }
  </div>
</sd-section>
