@if (label) {
  <div class="mb-0 d-flex" [class.sd-label--field]="!!htmlFor || !!labelId">
    <div style="display: flex; align-items: center; gap: 4px">
      @if (htmlFor) {
        <!-- why: <label for> thật — bấm nhãn focus đúng input và nhãn thành tên truy cập của control.
             Dấu * nằm TRONG label nên bấm vào cũng focus; aria-hidden vì control đã tự báo
             required (thuộc tính required/aria-required), đọc thêm "sao" chỉ gây nhiễu. -->
        <label class="T14M sd-label__text" [attr.for]="htmlFor" [attr.id]="labelId"
          >{{ label }}@if (required) {<span class="text-error sd-label__required" aria-hidden="true">&nbsp;*</span>}</label
        >
      } @else if (labelId) {
        <!-- why: control không phải input gốc (mat-select…) trỏ aria-labelledby sang id này;
             dấu * đứng liền nhãn như nhánh <label for>, aria-hidden nên không lọt vào tên truy cập. -->
        <span class="T14M sd-label__text" [attr.id]="labelId"
          >{{ label }}@if (required) {<span class="text-error sd-label__required" aria-hidden="true">&nbsp;*</span>}</span
        >
      } @else {
        <span class="T14M">{{ label }}</span>
      }
      @if (helperText) {
        <sd-icon
          style="height: 1rem; width: 1rem; font-size: 1rem"
          [matTooltip]="helperText"
          matTooltipPosition="below" name="info"></sd-icon>
      }
    </div>
    @if (required && !htmlFor && !labelId) {
      <span class="text-error mb-2 T14M">*</span>
    }
  </div>
  @if (description) {
    <div class="text-secondary T12R">{{ description }}</div>
  }
}
