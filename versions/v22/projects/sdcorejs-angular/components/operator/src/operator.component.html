@if (isReadonly()) {
  <!-- readonly (A2): glyph có tên và tooltip, không mở menu, không nhận Tab; màu theo chip chứa nó. -->
  <span
    class="sd-operator__glyph"
    role="img"
    [attr.aria-label]="currentLabel() || null"
    [matTooltip]="currentLabel()"
    matTooltipPosition="above"
    [attr.data-autoId]="autoId() ?? null"
    [innerHTML]="currentIcon()"></span>
} @else {
  <!-- Trigger dùng chung chip operator của control (thiết kế đợt 2 · G): xs glyph, sm / md chip, cùng một menu. -->
  <sd-operator-chip
    standalone
    [operators]="operators()"
    [operator]="model()"
    (operatorChange)="select($any($event))"
    [size]="size()"
    [hasValue]="active()"
    [disabled]="disabled()"
    [showCode]="showCode()"
    [autoId]="autoId()" />
}
