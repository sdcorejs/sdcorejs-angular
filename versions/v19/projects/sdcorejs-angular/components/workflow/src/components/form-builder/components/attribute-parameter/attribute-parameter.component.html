<div class="d-flex align-items-center py-4">
  @if (label) {
    <div class="T14R" style="flex: 1">{{ label }}</div>
  }
  <div style="width: 200px" class="d-flex align-items-center">
    <a class="T12R" href="javascript:;" (click)="edit()">{{ queryString }}</a>
  </div>
</div>
<sd-modal title="Gán giá trị Tham số" width="500px">
  <div class="c-builder">
    <div class="d-flex justify-content-end">
      <sd-button prefixIcon="add" title="Thêm trường" color="primary" (click)="addField()"></sd-button>
    </div>
    <!-- Cấp 1 -->
    @for (item of items; track item.id; let idx = $index) {
      <div class="d-flex align-items-center py-8" style="gap: 8px">
        <sd-input label="Tên tham số" [form]="form" style="flex: 1" [(model)]="item.key" required hideInlineError></sd-input>
        <sd-input label="Giá trị tương ứng" [form]="form" style="flex: 1" [(model)]="item.value" required hideInlineError></sd-input>
        <div style="width: 32px; min-width: 32px">
            <sd-button
              prefixIcon="delete"
              tooltip="Xóa"
              (click)="remove(idx)"
              size="sm"
              class="p-0"
            ></sd-button>
          </div>
      </div>
    }
  </div>
  <ng-container sdFooter>
    <sd-button prefixIcon="save" title="Xác nhận" (click)="onAccept()" color="primary" type="fill"></sd-button>
  </ng-container>
</sd-modal>
