@let item = field();
@if (viewed()) {
  <!-- why: view mode uses sd-view (label + value) like the other controls; the value is formatted by
       the preset precision with its currency/% suffix — not a disabled input. -->
  <sd-view [label]="item.label || item.key" [display]="value() | componentViewed: item"></sd-view>
} @else if (suffix()) {
  <!-- why: two branches instead of wrapping <ng-template sdSuffixDef> in @if — the contentChild of
       sd-input-number only sees statically projected templates, and an empty one still draws the suffix box. -->
  <sd-input-number
    [form]="form()"
    [label]="item.label || item.key"
    [helperText]="item.helperText"
    [placeholder]="item.placeholder"
    [labelPlacement]="labelPlacement()"
    [inputmode]="inputmode()"
    [name]="item.key"
    [autoId]="item.key"
    [model]="value()"
    (modelChange)="setValue($event)"
    [required]="required()"
    [disabled]="disabled()"
    [precision]="precision()"
    [validator]="effectiveValidator()"
    [max]="max()"
    [min]="min()">
    <ng-template sdSuffixDef
      ><span class="sd-fg-number-suffix" aria-hidden="true">{{ suffix() }}</span></ng-template
    >
  </sd-input-number>
} @else {
  <sd-input-number
    [form]="form()"
    [label]="item.label || item.key"
    [helperText]="item.helperText"
    [placeholder]="item.placeholder"
    [labelPlacement]="labelPlacement()"
    [inputmode]="inputmode()"
    [name]="item.key"
    [autoId]="item.key"
    [model]="value()"
    (modelChange)="setValue($event)"
    [required]="required()"
    [disabled]="disabled()"
    [precision]="precision()"
    [validator]="effectiveValidator()"
    [max]="max()"
    [min]="min()"></sd-input-number>
}
