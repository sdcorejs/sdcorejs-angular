<!-- why: `(selectionChange)` bên dưới là output của `MatStepper` (Angular Material), KHÔNG phải output của
     `<sd-stepper>` — phải giữ nguyên tên. Output công khai của lib đã đổi thành `sdSelectionChange`. -->
<mat-stepper
  class="sd-stepper"
  [(selectedIndex)]="selectedIndex"
  [linear]="linear()"
  [orientation]="orientation()"
  [labelPosition]="labelPosition()"
  [headerPosition]="headerPosition()"
  [animationDuration]="animationDuration()"
  [disableRipple]="disableRipple()"
  (selectionChange)="onSelectionChange($event)">
  @for (step of steps(); track step; let i = $index) {
    <mat-step
      [stepControl]="step.stepControl() ?? undefined!"
      [optional]="step.optional()"
      [editable]="step.editable()"
      [state]="step.state() ?? ''"
      [errorMessage]="step.errorMessage() ?? ''">
      <ng-template matStepLabel>
        <span class="sd-step__label">
          @if (step.icon(); as ic) {
            <sd-icon class="sd-step__icon" [name]="ic"></sd-icon>
          }
          <span class="sd-step__text">{{ step.label() }}</span>
        </span>
      </ng-template>

      <ng-template matStepContent>
        <ng-container [ngTemplateOutlet]="step.bodyTpl()"></ng-container>
      </ng-template>
    </mat-step>
  }
</mat-stepper>
