<!-- why: [href] là thuộc tính DOM kiểu CHUỖI. Bản cũ bind `[tab.url]` — một MẢNG — và chỉ "chạy
     được" nhờ mảng 1 phần tử tự stringify lúc Angular sanitize URL. Bind thẳng chuỗi: đúng kiểu,
     bỏ một slot pure-function thừa, và giá trị bind khớp đúng thứ render ra DOM.
     why: `[title]="info.icon"` ngay trên `[title]="info.name"` đã bị xoá — binding chết do
     copy-paste, luôn bị ghi đè ngay và bắt sd-badge nhận hai giá trị title mỗi lần CD. -->
<a
  [href]="tab.url"
  class="tab-router__item d-flex align-items-center gap-8"
  [class.tab-router__item--active]="tab.isActive"
  (click)="onTabClick($event)"
  (mousedown)="onMousedown($event)"
  (mouseup)="onMouseup($event)">
  @let info = tabInfo | sdTabInfo: tab;
  @if (info) {
    <sd-badge
      style="overflow: hidden;white-space: nowrap;"
      [icon]="info.icon"
      [tooltip]="info.tooltip || info.name"
      [title]="info.name"
      [color]="info.color"
      (click)="onTabClick($event)"></sd-badge>
    <button
      aria-hidden="true"
      class="tab-router__close d-flex align-items-center justify-content-center ml-auto p-0"
      (click)="close($event)"
      (mousedown)="$event.stopPropagation()">
      <sd-icon aria-hidden="true" fontIcon="close"></sd-icon>
    </button>
  }
</a>
