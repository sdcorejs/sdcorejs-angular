@let _key = key();
<button
  type="button"
  class="c-saved-filters"
  [disabled]="!_key"
  [sdQueryPanelTrigger]="panel"
  [matTooltip]="_key ? tooltipLabel() : tooltipDisabledLabel()"
  [attr.aria-label]="tooltipLabel()"
  [attr.data-autoid]="autoIdOf('saved-filters')"
  (panelOpened)="onOpening()">
  <sd-icon name="bookmark_border"></sd-icon>
</button>

<!-- Panel theo khung Action Popover (handoff mục 5.2): tiêu đề, hàng [nút áp | nút xoá], đường kẻ, "Lưu bộ lọc hiện tại".
     why: nút xoá là button thường đặt CẠNH nút áp (không lồng trong nhau, ngoài vòng mũi tên của menu). -->
<ng-template sdQueryPanel="menu" sdQueryPanelAlign="end" #panel="sdQueryPanel">
  <div
    class="sd-query-panel sd-query-panel--list c-saved-filters-menu"
    role="menu"
    tabindex="-1"
    [class.c-saved-filters-menu--coarse]="coarse()"
    [attr.aria-labelledby]="headingId"
    [attr.data-autoid]="autoIdOf('panel-saved-filters')"
    (keydown)="onKeydown($event)">
    <div class="c-sf-heading" [id]="headingId">{{ headingLabel() }}</div>
    @if (readError()) {
      <div class="c-sf-state c-sf-state--error">
        <sd-icon name="error" aria-hidden="true"></sd-icon>
        <span>{{ readErrorLabel() }}</span>
      </div>
    }
    @for (f of savedFilters(); track f.id; let i = $index) {
      <div class="c-sf-row" role="none">
        <button
          type="button"
          role="menuitem"
          tabindex="-1"
          class="c-sf-apply"
          [attr.data-autoid]="autoIdOf('saved-filter-' + i)"
          (click)="pick(f)">
          <sd-icon class="c-sf-lead" name="filter_alt" aria-hidden="true"></sd-icon>
          <span class="c-sf-name">{{ f.name }}</span>
        </button>
        <button
          type="button"
          tabindex="-1"
          class="c-sf-del"
          [attr.aria-label]="deleteLabel(f.name)"
          [attr.data-autoid]="autoIdOf('saved-filter-' + i + '-delete')"
          (click)="removeAt(i)">
          <sd-icon name="delete" aria-hidden="true"></sd-icon>
        </button>
      </div>
    } @empty {
      @if (!readError()) {
        <div class="c-sf-state">{{ emptyLabel() }}</div>
      }
    }
    <div class="c-sf-divider" role="separator"></div>
    <button
      type="button"
      role="menuitem"
      tabindex="-1"
      class="c-sf-save"
      [disabled]="!_key || !canSave()"
      [attr.data-autoid]="autoIdOf('saved-filters-save')"
      (click)="onSave()">
      <sd-icon name="bookmark_add" aria-hidden="true"></sd-icon>
      <span>{{ saveLabel() }}</span>
    </button>
  </div>
</ng-template>
