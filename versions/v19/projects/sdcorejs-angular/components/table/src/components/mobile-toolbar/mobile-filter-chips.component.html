@let _autoId = table().autoId();
@let _count = count();
<div class="sd-mobile-chips" role="toolbar" [attr.aria-label]="'core.component.table.filter' | sdTranslate">
  <button
    mat-button
    type="button"
    class="sd-mobile-chip sd-mobile-chip--filter"
    aria-haspopup="dialog"
    [attr.aria-label]="filterLabel()"
    [attr.data-autoid]="_autoId ? _autoId + '-mobile-filter' : null"
    (click)="openAll()">
    <sd-icon name="tune" size="18px"></sd-icon>
    <span class="sd-mobile-chip-text">{{ 'core.component.table.filter' | sdTranslate }}</span>
    @if (_count) {
      <span class="sd-mobile-chip-count" aria-hidden="true">{{ _count }}</span>
    }
  </button>
  <ng-content></ng-content>
  @if (chips().length) {
    <span class="sd-mobile-chip-divider" aria-hidden="true"></span>
  }
  @for (chip of chips(); track chip.item.key) {
    <button
      mat-button
      type="button"
      class="sd-mobile-chip sd-mobile-chip--field"
      [class.sd-mobile-chip--active]="chip.active"
      aria-haspopup="dialog"
      [attr.aria-label]="chip.text"
      [attr.data-autoid]="_autoId ? _autoId + '-mobile-filter-' + chip.field : null"
      (click)="openField(chip)">
      <span class="sd-mobile-chip-text">{{ chip.text }}</span>
      <sd-icon name="arrow_drop_down" size="18px"></sd-icon>
    </button>
  }
</div>
<sd-table-mobile-field-sheet [table]="table()" [labels]="labels"></sd-table-mobile-field-sheet>
