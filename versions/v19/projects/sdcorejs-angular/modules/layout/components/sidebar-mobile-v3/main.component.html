<div class="sd-sidebar-mobile-v3 d-flex flex-column">
  <header
    class="sd-sidebar-mobile-v3__topbar d-flex align-items-center justify-content-between gap-8 px-16 bg-white border-bottom border-black200">
    <div class="d-flex align-items-center gap-8 overflow-hidden">
      @if (sidebar().logoUrl) {
        <img class="sd-sidebar-mobile-v3__logo" [src]="sidebar().logoUrl" alt="" />
      }
      <span class="T16M text-ellipsis">{{ sidebar().defaultTitle || 'Back Office' }}</span>
    </div>
    <button
      #trigger
      type="button"
      data-v3-mobile-trigger
      class="sd-sidebar-mobile-v3__icon-action d-flex align-items-center justify-content-center"
      aria-label="Mở menu"
      [attr.aria-expanded]="isDrawerOpen()"
      (click)="openDrawer($event.currentTarget)">
      <sd-icon name="menu"></sd-icon>
    </button>
  </header>

  <main class="flex-1 overflow-auto">
    <ng-content></ng-content>
  </main>

  @if (isDrawerOpen()) {
    <button type="button" class="sd-sidebar-mobile-v3__backdrop" aria-label="Đóng menu" (click)="closeFromBackdrop()"></button>
    <aside
      class="sd-sidebar-mobile-v3__drawer d-flex flex-column bg-white mat-elevation-z8"
      role="dialog"
      aria-modal="true"
      aria-label="Menu chính"
      cdkTrapFocus
      [cdkTrapFocusAutoCapture]="true"
      (keydown)="onDrawerKeydown($event)">
      <header class="d-flex align-items-center justify-content-between gap-8 px-16 py-12 border-bottom border-black200">
        <span class="T18M text-ellipsis">{{ sidebar().defaultTitle || 'Back Office' }}</span>
        <button
          type="button"
          class="sd-sidebar-mobile-v3__icon-action d-flex align-items-center justify-content-center"
          aria-label="Đóng menu"
          (click)="closeFromBackdrop()">
          <sd-icon name="close"></sd-icon>
        </button>
      </header>
      <div class="sd-sidebar-mobile-v3__navigation d-flex flex-column gap-16 flex-1 overflow-auto p-12">
        <sd-layout-user-menu [userInfo]="userInfo()"></sd-layout-user-menu>
        <div class="sd-sidebar-mobile-v3__search bg-white">
          <sd-layout-search-field
            placeholder="Tìm trong tất cả menu"
            [autoId]="'layout-v3-mobile-global-search'"
            [model]="searchText()"
            (sdChange)="searchText.set($event)">
          </sd-layout-search-field>
        </div>
        @if (pinnedMenus().length) {
          <section data-v3-mobile-pinned class="d-flex flex-column gap-4">
            <h2 class="T12M text-black400 px-12 m-0">Đã ghim</h2>
            <sd-layout-menu-tree
              [menus]="pinnedMenus()"
              [activePath]="activePath()"
              [pinnedKeys]="pinnedKeys()"
              (navigate)="navigateMenu($event)"
              (togglePinned)="onTogglePinned($event)">
            </sd-layout-menu-tree>
          </section>
        }
        @if (recentConfiguration().enabled && recentMenus().length) {
          <section data-v3-mobile-recent class="d-flex flex-column gap-4">
            <h2 class="T12M text-black400 px-12 m-0">Gần đây</h2>
            <sd-layout-menu-tree [menus]="recentMenus()" [activePath]="activePath()" [showPin]="false" (navigate)="navigateMenu($event)">
            </sd-layout-menu-tree>
          </section>
        }
        <section class="d-flex flex-column gap-4">
          <h2 class="T12M text-black400 px-12 m-0">Tất cả menu</h2>
          <sd-layout-menu-tree
            [menus]="menus()"
            [query]="searchText()"
            [activePath]="activePath()"
            [pinnedKeys]="pinnedKeys()"
            (navigate)="navigateMenu($event)"
            (togglePinned)="onTogglePinned($event)">
          </sd-layout-menu-tree>
        </section>
      </div>
    </aside>
  }
</div>
