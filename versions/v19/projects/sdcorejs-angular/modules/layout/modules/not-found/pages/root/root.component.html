@let _userInfo = userInfo();
<sd-page>
  <div class="d-flex flex-column" headerLeft>
    <div class="font-weight-medium fs-20">{{ 'core.module.layout.greeting.hello' | sdTranslate: { name: _userInfo?.fullName ?? _userInfo?.email ?? _userInfo?.username ?? '' } }}</div>
    <span class="T12R text-secondary">{{ todayInfo() }}</span>
  </div>

  <div class="h-full d-flex flex-column align-items-center">
    <div class="h-full d-flex flex-column align-items-center justify-content-center text-center wrapper">
      <img alt="not-found" class="sd-image-not-found" />
      <span class="T16M mt-24">{{ 'core.module.layout.not-found.title' | sdTranslate }}</span>
      <span class="T16R text-secondary mt-4">
        {{ 'core.module.layout.not-found.message' | sdTranslate }}
      </span>
      <sd-button class="mt-16" type="fill" color="primary" (click)="reload()" [title]="'core.module.layout.not-found.back' | sdTranslate" prefixIcon="arrow_back"> </sd-button>
    </div>
  </div>
</sd-page>
