<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>sd-query-bar · UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; background: #f0f2f5; color: #212121; }
    *, *::before, *::after { box-sizing: border-box; }
    @keyframes sd-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    button { font-family: inherit; }
    input { font-family: inherit; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="sd-table.jsx"></script>
  <script type="text/babel" src="sd-query-bar.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { DesignCanvas, DCSection, DCArtboard } = window;
    const { TweaksPanel, TweakSection, TweakRadio, TweakSelect, TweakSlider, TweakToggle, useTweaks } = window;
    const {
      SdQueryBar, QB_FIELDS, qbTokens, QBIcon, ModeToggle, KIND_ICON,
      SdTable, PageHeader, ROWS,
    } = window;

    /* ------- Reusable artboard wrapper ------- */
    function Frame({ children, label, hint, bg = '#f0f2f5', padding = 24 }) {
      return (
        <div style={{ background: bg, padding, minHeight: '100%', display: 'flex', flexDirection: 'column', gap: 12 }}>
          {label && (
            <div>
              <div style={{ fontSize: 11, letterSpacing: 0.6, textTransform: 'uppercase', color: '#7a7a7a', fontWeight: 600 }}>{label}</div>
              {hint && <div style={{ fontSize: 12, color: '#5f6368', marginTop: 2 }}>{hint}</div>}
            </div>
          )}
          {children}
        </div>
      );
    }

    /* =================================================================== */
    /* V1 — Resting states (empty, one, several) */
    /* =================================================================== */
    function V1Resting() {
      return (
        <Frame label="V1 · Resting states" hint="Tiến triển từ rỗng → một filter → nhiều filter. Mặc định ẩn operator.">
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div>
              <Caption>Rỗng — chỉ có "Thêm filter"</Caption>
              <SdQueryBar filters={[]} />
            </div>
            <div>
              <Caption>Một filter đã chọn</Caption>
              <SdQueryBar filters={[
                { field: 'status', operator: 'IN', value: ['Hoạt động'] },
              ]} />
            </div>
            <div>
              <Caption>Vài filter — đa dạng kiểu</Caption>
              <SdQueryBar filters={[
                { field: 'dept',    operator: 'IN',      value: ['Kỹ thuật', 'Sản phẩm'] },
                { field: 'status',  operator: 'IN',      value: ['Hoạt động'] },
                { field: 'salary',  operator: 'BETWEEN', value: [20000000, 40000000] },
                { field: 'hiredAt', operator: 'GREATER', value: '01/01/2023' },
              ]} />
            </div>
            <div>
              <Caption>Pending — field đã chọn nhưng chưa có value</Caption>
              <SdQueryBar filters={[
                { field: 'dept',     operator: 'IN', value: ['Kỹ thuật'] },
                { field: 'position', operator: 'CONTAIN', value: '' },
              ]} />
            </div>
          </div>
        </Frame>
      );
    }

    function Caption({ children }) {
      return <div style={{ fontSize: 11, color: '#7a7a7a', marginBottom: 6, fontFamily: 'Roboto Mono, monospace' }}>// {children}</div>;
    }

    /* =================================================================== */
    /* V2 — Add filter flow (field picker open) */
    /* =================================================================== */
    function V2Add() {
      return (
        <Frame label="V2 · Add filter flow" hint="Click 'Thêm filter' → popover liệt kê field còn lại với search.">
          <SdQueryBar
            filters={[
              { field: 'dept',   operator: 'IN', value: ['Kỹ thuật'] },
              { field: 'status', operator: 'IN', value: ['Hoạt động'] },
            ]}
            addOpen={true}
          />
          <div style={{ height: 320 }}></div>
        </Frame>
      );
    }

    /* =================================================================== */
    /* V3 — Edit chip flow (operator + value popover) */
    /* =================================================================== */
    function V3Edit() {
      return (
        <Frame label="V3 · Edit chip" hint="Click chip → popover hiện operator picker + value control. Operator chỉ hiển thị ở đây, không trên chip.">
          <SdQueryBar
            filters={[
              { field: 'dept',    operator: 'IN',      value: ['Kỹ thuật', 'Sản phẩm'] },
              { field: 'status',  operator: 'IN',      value: ['Hoạt động'] },
              { field: 'salary',  operator: 'BETWEEN', value: [20000000, 40000000] },
            ]}
            editingIndex={1}
          />
          <div style={{ height: 320 }}></div>

          <div style={{ marginTop: 16, padding: 12, background: '#fff', border: '1px solid #e2e4e7', borderRadius: 6, fontSize: 12, color: '#5f6368', lineHeight: 1.6 }}>
            <strong style={{ color: '#212121' }}>Pattern:</strong> Operator được giấu khỏi chip face để gọn gàng. Khi click vào chip:
            <ul style={{ margin: '6px 0 0 16px', padding: 0 }}>
              <li>Hàng <code>ĐIỀU KIỆN</code> chứa operator dropdown — chọn được từ list theo kind (IN/NOT_IN với select, BETWEEN với number/date...)</li>
              <li>Hàng <code>GIÁ TRỊ</code> render control theo kind (checkbox list, input, date range...)</li>
              <li>Footer: Xóa filter (đỏ, trái) + Áp dụng (primary, phải)</li>
            </ul>
          </div>
        </Frame>
      );
    }

    /* =================================================================== */
    /* V4 — Logic AND/OR toggle */
    /* =================================================================== */
    function V4Logic() {
      return (
        <Frame label="V4 · Logic AND / OR" hint="AND ngầm định. Khi có ≥2 filter, toggle xuất hiện bên phải để chuyển OR ở cấp toàn cục.">
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div>
              <Caption>AND mặc định — không hiển thị connector giữa chips</Caption>
              <SdQueryBar
                filters={[
                  { field: 'dept',   operator: 'IN', value: ['Kỹ thuật'] },
                  { field: 'status', operator: 'IN', value: ['Hoạt động'] },
                  { field: 'tags',   operator: 'IN', value: ['Senior'] },
                ]}
                logic="AND"
                showLogic={true}
              />
            </div>

            <div>
              <Caption>Toggle sang OR — connector "OR" hiển thị giữa chips</Caption>
              <SdQueryBar
                filters={[
                  { field: 'dept',   operator: 'IN', value: ['Kỹ thuật'] },
                  { field: 'status', operator: 'IN', value: ['Thử việc'] },
                  { field: 'tags',   operator: 'IN', value: ['Senior'] },
                ]}
                logic="OR"
                showLogic={true}
              />
            </div>

            <div style={{ marginTop: 8, padding: 12, background: '#fff', border: '1px solid #e2e4e7', borderRadius: 6, fontSize: 12, color: '#5f6368', lineHeight: 1.7 }}>
              <strong style={{ color: '#212121' }}>Quy ước:</strong> connector chỉ xuất hiện khi logic = OR vì OR là exception cần nhấn mạnh. AND giữ im lặng để giảm noise — đây là behavior của Jira/Linear, ngược với SQL builder cổ điển.
            </div>
          </div>
        </Frame>
      );
    }

    /* =================================================================== */
    /* V5 — Full kit: search + saved views + clear all + operator visible */
    /* =================================================================== */
    function V5Full() {
      return (
        <Frame label="V5 · Full kit" hint="Saved views + search input + operator visible + clear all. Mẫu giàu nhất khi cần.">
          <SdQueryBar
            filters={[
              { field: 'dept',    operator: 'IN',          value: ['Kỹ thuật', 'Sản phẩm'] },
              { field: 'status',  operator: 'NOT_IN',      value: ['Ngưng'] },
              { field: 'salary',  operator: 'GREATER_EQ',  value: 25000000 },
              { field: 'hiredAt', operator: 'BETWEEN',     value: ['01/01/2022', '31/12/2024'] },
            ]}
            showSearch={true}
            showSavedViews={true}
            showLogic={true}
            showOperatorOnChip={true}
          />

          <div style={{ marginTop: 8, padding: 12, background: '#fff', border: '1px solid #e2e4e7', borderRadius: 6, fontSize: 12, color: '#5f6368' }}>
            <strong style={{ color: '#212121' }}>Khi nào dùng:</strong> trang tra cứu phức tạp (báo cáo, danh sách giao dịch) cần saved views và operator tường minh cho audit. Mặc định nên dùng V1 cho table thường.
          </div>
        </Frame>
      );
    }

    /* =================================================================== */
    /* V6 — Coexist with InlineFilter (toggle mode) + table integration */
    /* =================================================================== */
    function V6Integrated() {
      const [mode, setMode] = React.useState('bar');
      return (
        <Frame label="V6 · Tích hợp với sd-table" hint="User toggle giữa Filter Bar và Inline Header. Không hiển thị đồng thời để tránh nhiễu.">
          <PageHeader title="Quản lý nhân viên" count={1234} />

          {/* Mode switch row */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: -4 }}>
            <ModeToggleLive value={mode} onChange={setMode} />
            <span style={{ fontSize: 12, color: '#5f6368' }}>
              {mode === 'bar' ? 'Filter ẩn — gọn 1 hàng' : 'Filter trong header — luôn nhìn thấy'}
            </span>
          </div>

          {mode === 'bar' ? (
            <SdQueryBar
              filters={[
                { field: 'dept',    operator: 'IN',          value: ['Kỹ thuật'] },
                { field: 'status',  operator: 'IN',          value: ['Hoạt động'] },
              ]}
              showSearch={true}
              showLogic={true}
            />
          ) : null}

          <SdTable rows={ROWS.slice(0, 6)} state="data" showInlineFilter={mode === 'inline'} total={1234} />
        </Frame>
      );
    }

    function ModeToggleLive({ value, onChange }) {
      const options = [
        { v: 'bar',    label: 'Filter Bar',    icon: 'view_agenda' },
        { v: 'inline', label: 'Inline Header', icon: 'view_column' },
      ];
      return (
        <div style={{
          display: 'inline-flex', alignItems: 'center',
          height: 32, borderRadius: 6,
          border: `1px solid ${qbTokens.border}`,
          background: qbTokens.bg, overflow: 'hidden',
        }}>
          {options.map((o, i) => (
            <span key={o.v}
              onClick={() => onChange(o.v)}
              style={{
                padding: '0 12px', height: '100%',
                display: 'inline-flex', alignItems: 'center', gap: 6,
                fontSize: 12, fontWeight: 500,
                color: value === o.v ? qbTokens.primary : qbTokens.textSecondary,
                background: value === o.v ? qbTokens.primaryFaint : 'transparent',
                borderLeft: i > 0 ? `1px solid ${qbTokens.borderSoft}` : 'none',
                cursor: 'pointer',
              }}>
              <QBIcon name={o.icon} size={14} />
              {o.label}
            </span>
          ))}
        </div>
      );
    }

    /* =================================================================== */
    /* PLAYGROUND — controlled by Tweaks panel */
    /* =================================================================== */
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "filterCount": 3,
      "density": "compact",
      "showOperator": false,
      "logic": "AND",
      "showLogicToggle": true,
      "showSearch": false,
      "showSavedViews": false,
      "showClearAll": true,
      "editingIndex": -1,
      "addOpen": false
    }/*EDITMODE-END*/;

    const SAMPLE_FILTERS = [
      { field: 'dept',     operator: 'IN',      value: ['Kỹ thuật', 'Sản phẩm'] },
      { field: 'status',   operator: 'IN',      value: ['Hoạt động'] },
      { field: 'salary',   operator: 'BETWEEN', value: [20000000, 40000000] },
      { field: 'hiredAt',  operator: 'GREATER', value: '01/01/2023' },
      { field: 'tags',     operator: 'IN',      value: ['Senior', 'Remote'] },
      { field: 'position', operator: 'CONTAIN', value: 'Engineer' },
    ];

    function Playground() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const filters = SAMPLE_FILTERS.slice(0, t.filterCount);
      const editingIndex = t.editingIndex >= 0 && t.editingIndex < filters.length ? t.editingIndex : null;
      return (
        <Frame label="Playground" hint="Tweak panel ở góc dưới phải để thử mọi biến thể.">
          <SdQueryBar
            filters={filters}
            density={t.density}
            logic={t.logic}
            showLogic={t.showLogicToggle}
            showSearch={t.showSearch}
            showSavedViews={t.showSavedViews}
            showClearAll={t.showClearAll}
            showOperatorOnChip={t.showOperator}
            editingIndex={editingIndex}
            addOpen={t.addOpen}
          />
          <div style={{ height: 420 }}></div>

          <TweaksPanel title="Tweaks · sd-query-bar">
            <TweakSection title="Nội dung">
              <TweakSlider tweaks={t} setTweak={setTweak} k="filterCount" label="Số filter" min={0} max={6} step={1} />
              <TweakRadio tweaks={t} setTweak={setTweak} k="logic" label="Logic" options={['AND','OR']} />
            </TweakSection>

            <TweakSection title="Phong cách chip">
              <TweakRadio tweaks={t} setTweak={setTweak} k="density" label="Density" options={['compact','comfortable']} />
              <TweakToggle tweaks={t} setTweak={setTweak} k="showOperator" label="Hiện operator trên chip" />
            </TweakSection>

            <TweakSection title="Phần tử bao quanh">
              <TweakToggle tweaks={t} setTweak={setTweak} k="showSearch" label="Ô search bên trái" />
              <TweakToggle tweaks={t} setTweak={setTweak} k="showSavedViews" label="Saved views menu" />
              <TweakToggle tweaks={t} setTweak={setTweak} k="showLogicToggle" label="Logic AND/OR toggle" />
              <TweakToggle tweaks={t} setTweak={setTweak} k="showClearAll" label="Nút 'Xóa tất cả'" />
            </TweakSection>

            <TweakSection title="Trạng thái tương tác">
              <TweakSlider tweaks={t} setTweak={setTweak} k="editingIndex" label="Chip đang mở (-1 = đóng)" min={-1} max={5} step={1} />
              <TweakToggle tweaks={t} setTweak={setTweak} k="addOpen" label="Popover 'Thêm filter' mở" />
            </TweakSection>
          </TweaksPanel>
        </Frame>
      );
    }

    /* =================================================================== */
    /* Icon fallback demo */
    /* =================================================================== */
    const FIELDS_NO_ICON = [
      { key: 'q',        label: 'Từ khóa',    kind: 'string' },
      { key: 'dept',     label: 'Phòng ban',  kind: 'select', options: ['Kỹ thuật', 'Sản phẩm', 'Nhân sự'] },
      { key: 'status',   label: 'Trạng thái', kind: 'select', options: ['Hoạt động', 'Thử việc'] },
      { key: 'salary',   label: 'Lương',      kind: 'number' },
      { key: 'hiredAt',  label: 'Ngày vào',   kind: 'date' },
      { key: 'isActive', label: 'Đang làm',   kind: 'boolean' },
    ];

    function IconFallback() {
      return (
        <Frame label="Icon fallback theo kind" hint="Khi field.icon không được set, sd-query-bar tự chọn icon theo data type. User vẫn override được bằng field.icon nếu muốn.">
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div>
              <Caption>Bảng mapping kind → icon</Caption>
              <div style={{
                background: '#fff', border: '1px solid #e2e4e7', borderRadius: 8,
                padding: 12, display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8,
              }}>
                {Object.entries(KIND_ICON).map(([kind, icon]) => (
                  <div key={kind} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '6px 8px', border: '1px solid #f0f2f5', borderRadius: 6 }}>
                    <span style={{
                      width: 28, height: 28, borderRadius: 6,
                      background: qbTokens.primaryFaint, color: qbTokens.primary,
                      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                    }}>
                      <QBIcon name={icon} size={16} color={qbTokens.primary} />
                    </span>
                    <div style={{ display: 'flex', flexDirection: 'column' }}>
                      <span style={{ fontSize: 12, fontWeight: 600, color: '#212121', fontFamily: 'Roboto Mono, monospace' }}>{kind}</span>
                      <span style={{ fontSize: 11, color: '#7a7a7a', fontFamily: 'Roboto Mono, monospace' }}>{icon}</span>
                    </div>
                  </div>
                ))}
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '6px 8px', border: '1px dashed #d6d8db', borderRadius: 6 }}>
                  <span style={{
                    width: 28, height: 28, borderRadius: 6,
                    background: '#eceff1', color: '#5f6368',
                    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                  }}>
                    <QBIcon name="tune" size={16} color="#5f6368" />
                  </span>
                  <div style={{ display: 'flex', flexDirection: 'column' }}>
                    <span style={{ fontSize: 12, fontWeight: 600, color: '#212121', fontFamily: 'Roboto Mono, monospace' }}>(fallback)</span>
                    <span style={{ fontSize: 11, color: '#7a7a7a', fontFamily: 'Roboto Mono, monospace' }}>tune</span>
                  </div>
                </div>
              </div>
            </div>

            <div>
              <Caption>Field config KHÔNG có icon — chip tự fallback theo kind</Caption>
              <SdQueryBar
                fields={FIELDS_NO_ICON}
                filters={[
                  { field: 'q',        operator: 'CONTAIN', value: 'Nguyễn' },
                  { field: 'dept',     operator: 'IN',      value: ['Kỹ thuật'] },
                  { field: 'salary',   operator: 'GREATER', value: 25000000 },
                  { field: 'hiredAt',  operator: 'BETWEEN', value: ['01/01/2023', '31/12/2024'] },
                  { field: 'isActive', operator: 'EQUAL',   value: true },
                ]}
              />
            </div>

            <div>
              <Caption>Field picker — list field cũng fallback theo kind</Caption>
              <SdQueryBar fields={FIELDS_NO_ICON} filters={[]} addOpen={true} />
              <div style={{ height: 280 }}></div>
            </div>

            <div style={{ padding: 12, background: '#fff', border: '1px solid #e2e4e7', borderRadius: 6, fontSize: 12, color: '#5f6368', lineHeight: 1.7 }}>
              <strong style={{ color: '#212121' }}>Thứ tự ưu tiên:</strong>{' '}
              <code style={{ fontFamily: 'Roboto Mono, monospace', background: '#f5f6f7', padding: '1px 5px', borderRadius: 3 }}>field.icon</code>
              {' → '}
              <code style={{ fontFamily: 'Roboto Mono, monospace', background: '#f5f6f7', padding: '1px 5px', borderRadius: 3 }}>KIND_ICON[field.kind]</code>
              {' → '}
              <code style={{ fontFamily: 'Roboto Mono, monospace', background: '#f5f6f7', padding: '1px 5px', borderRadius: 3 }}>'tune'</code>.
              {' '}Map nằm trong <code style={{ fontFamily: 'Roboto Mono, monospace' }}>sd-query-bar.jsx</code> export tên <code style={{ fontFamily: 'Roboto Mono, monospace' }}>KIND_ICON</code> — sửa một chỗ là đồng bộ toàn bộ.
            </div>
          </div>
        </Frame>
      );
    }

    /* =================================================================== */
    /* Naming proposals card */
    /* =================================================================== */
    function Naming() {
      const props = [
        { name: 'sd-query-bar', pros: 'Khái niệm rộng — chứa filter + search + sort + logic. Khớp Linear/Notion/Sentry.', cons: 'Hơi rộng nếu chỉ làm filter thuần.', pick: true },
        { name: 'sd-filter-bar', pros: 'Rõ ngay là filter. Đúng với prefix sd- và tương đồng InlineFilter.', cons: 'Đặt tên hẹp, sau khó mở rộng sang search/sort.' },
        { name: 'sd-filter-row', pros: 'Gợi layout 1 hàng.', cons: 'Sai khi nó wrap nhiều dòng.' },
        { name: 'sd-filter-chips', pros: 'Nhấn mạnh hình dạng.', cons: 'Thiên về visual, không nói về behavior.' },
      ];
      return (
        <Frame label="Đề xuất tên · sd-query-bar" hint="Đã chọn theo preference của bạn — mở rộng được sang search, sort, logic.">
          <div style={{ background: '#fff', border: '1px solid #e2e4e7', borderRadius: 8, padding: 16 }}>
            <div style={{ display: 'grid', gridTemplateColumns: '180px 1fr 1fr 60px', gap: 12, fontSize: 12, color: '#5f6368', fontWeight: 600, paddingBottom: 8, borderBottom: '1px solid #e2e4e7', textTransform: 'uppercase', letterSpacing: 0.5 }}>
              <div>Tên</div><div>Ưu</div><div>Nhược</div><div>Chọn</div>
            </div>
            {props.map((p) => (
              <div key={p.name} style={{ display: 'grid', gridTemplateColumns: '180px 1fr 1fr 60px', gap: 12, fontSize: 13, color: '#212121', padding: '12px 0', borderBottom: '1px solid #f0f2f5' }}>
                <div style={{ fontFamily: 'Roboto Mono, monospace', fontWeight: 500, color: p.pick ? '#1657d4' : '#212121' }}>{p.name}</div>
                <div style={{ color: '#5f6368' }}>{p.pros}</div>
                <div style={{ color: '#5f6368' }}>{p.cons}</div>
                <div>{p.pick && <span style={{ background: '#e7f6ec', color: '#0f7c3a', fontSize: 11, fontWeight: 600, padding: '2px 8px', borderRadius: 999 }}>CHỌN</span>}</div>
              </div>
            ))}
          </div>

          <div style={{ background: '#fff', border: '1px solid #e2e4e7', borderRadius: 8, padding: 16 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: '#212121', marginBottom: 8 }}>API đề xuất (Angular)</div>
            <pre style={{ margin: 0, fontSize: 12, color: '#212121', fontFamily: 'Roboto Mono, monospace', background: '#f5f6f7', padding: 12, borderRadius: 6, overflow: 'auto', lineHeight: 1.6 }}>{`<sd-query-bar
  [fields]="fields"           // FieldDef[] — { key, label, kind, operators?, options? }
  [(filters)]="filters"       // Filter[]   — { field, operator, value } (utils/Filter)
  [(logic)]="'AND' | 'OR'"
  [showSearch]="false"
  [showSavedViews]="false"
  [showOperatorOnChip]="false"
  [density]="'compact' | 'comfortable'"
  (filtersChange)="onChange($event)"
  (apply)="reload()"
></sd-query-bar>`}</pre>
          </div>

          <div style={{ background: '#fff', border: '1px solid #e2e4e7', borderRadius: 8, padding: 16 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: '#212121', marginBottom: 8 }}>Tích hợp với sd-table</div>
            <div style={{ fontSize: 13, color: '#5f6368', lineHeight: 1.6 }}>
              Reuse <code style={{ fontFamily: 'Roboto Mono, monospace', background: '#f5f6f7', padding: '1px 5px', borderRadius: 3 }}>Filter</code> và <code style={{ fontFamily: 'Roboto Mono, monospace', background: '#f5f6f7', padding: '1px 5px', borderRadius: 3 }}>Operator</code> từ utils. <code style={{ fontFamily: 'Roboto Mono, monospace', background: '#f5f6f7', padding: '1px 5px', borderRadius: 3 }}>sd-table</code> chỉ cần thêm input <code style={{ fontFamily: 'Roboto Mono, monospace', background: '#f5f6f7', padding: '1px 5px', borderRadius: 3 }}>[filterMode]="'bar' | 'inline' | 'external'"</code> để chuyển giữa các chế độ. Filter array là <em>single source of truth</em>, dù người dùng đặt qua chip, header hay form ngoài.
            </div>
          </div>
        </Frame>
      );
    }

    /* =================================================================== */
    /* APP */
    /* =================================================================== */
    const ART_W = 1280;
    const ART_H = 560;

    function App() {
      return (
        <DesignCanvas title="sd-query-bar · Unified filter row" subtitle="Jira-style chip dropdowns · dùng chung model Filter/Operator với sd-table">
          <DCSection id="states" title="Trạng thái chính">
            <DCArtboard id="resting" label="V1 · Resting — empty → một → nhiều filter" width={ART_W} height={620}><V1Resting /></DCArtboard>
            <DCArtboard id="add"     label="V2 · Add filter — field picker mở"        width={ART_W} height={ART_H}><V2Add /></DCArtboard>
            <DCArtboard id="edit"    label="V3 · Edit chip — operator + value popover" width={ART_W} height={ART_H + 100}><V3Edit /></DCArtboard>
          </DCSection>

          <DCSection id="variants" title="Biến thể nâng cao">
            <DCArtboard id="logic"   label="V4 · Logic AND / OR toggle"  width={ART_W} height={ART_H}><V4Logic /></DCArtboard>
            <DCArtboard id="full"    label="V5 · Full kit (search + saved views + operator)" width={ART_W} height={ART_H - 80}><V5Full /></DCArtboard>
            <DCArtboard id="integ"   label="V6 · Tích hợp sd-table — toggle Bar / Inline" width={ART_W} height={900}><V6Integrated /></DCArtboard>
          </DCSection>

          <DCSection id="meta" title="Playground & tên gọi">
            <DCArtboard id="iconfallback" label="Icon fallback theo kind (khi field.icon không set)" width={ART_W} height={780}><IconFallback /></DCArtboard>
            <DCArtboard id="playground" label="Playground — Tweaks live" width={ART_W} height={680}><Playground /></DCArtboard>
            <DCArtboard id="naming"     label="Đề xuất tên + API"        width={ART_W} height={780}><Naming /></DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
