@if (component.properties?.viewed) {
  <div class="d-block T12R text-secondary">
    {{ component.label }}
  </div>
  <svg
    width="64"
    height="64"
    viewBox="0 0 1280 1280"
    xmlns="http://www.w3.org/2000/svg"
    fill-rule="evenodd"
    clip-rule="evenodd"
    stroke-linejoin="round"
    stroke-miterlimit="2"
    alt="This is an image placeholder">
    <path fill="#e5e9ed" d="M0 0h1280v1280H0z"></path>
    <path d="M910 410H370v470h540V410zm-57.333 57.333v355.334H427.333V467.333h425.334z" fill="#cad3db"></path>
    <path d="M810 770H480v-60l100-170 130 170 100-65v125z" fill="#cad3db"></path>
    <circle cx="750" cy="550" r="50" fill="#cad3db" transform="translate(10 10)"></circle>
  </svg>
} @else {
  <div class="d-block mb-0 T14M">
    {{ component.label }}
    @if (component.validate?.required) {
      <span class="text-error mb-2">*</span>
    }
  </div>
  <div class="c-upload-file d-flex align-items-center justify-content-between">
    <svg
      width="64"
      height="64"
      viewBox="0 0 1280 1280"
      xmlns="http://www.w3.org/2000/svg"
      fill-rule="evenodd"
      clip-rule="evenodd"
      stroke-linejoin="round"
      stroke-miterlimit="2"
      alt="This is an image placeholder">
      <path fill="#e5e9ed" d="M0 0h1280v1280H0z"></path>
      <path d="M910 410H370v470h540V410zm-57.333 57.333v355.334H427.333V467.333h425.334z" fill="#cad3db"></path>
      <path d="M810 770H480v-60l100-170 130 170 100-65v125z" fill="#cad3db"></path>
      <circle cx="750" cy="550" r="50" fill="#cad3db" transform="translate(10 10)"></circle>
    </svg>
  </div>
}
