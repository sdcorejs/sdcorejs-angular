<div class="c-anchor-vertical" [ngClass]="{ 'c-stop-scroll-propagation': !isOverscroll }" #wrapper>
  <!-- Nội dung -->
  <div class="c-anchor-content" #anchorContent>
    <ng-content></ng-content>
  </div>

  <!-- Danh sách tiêu đề các sections-->
   @if(!isHiddenAnchorList){
     <div class="c-anchor-list" [style.width]="sidebarWidth">
       <sd-anchor-vertical-list-v2
         [sections]="sections"
         [ellipsis]="ellipsis"
         [sidebarWidth]="sidebarWidth"
         [activeSectionId]="activeSectionId"
         (sdClickSection)="scrollSectionByClick($event)">
       </sd-anchor-vertical-list-v2>
     </div>
   }
</div>
