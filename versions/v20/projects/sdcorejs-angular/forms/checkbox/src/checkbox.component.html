@if (isViewed()) {
  @if (label()) {
    <div class="sd-view-label T14R">{{ label() }}</div>
  }
  <div class="sd-view-value T14M">{{ (model() ? 'core.form.checkbox.checked' : 'core.form.checkbox.unchecked') | sdTranslate }}</div>
} @else {
  <mat-checkbox
    [formControl]="formControl"
    [attr.data-autoId]="autoId()"
    [attr.data-disabled]="dataDisabled()"
    [attr.data-empty]="dataEmpty()"
    [attr.data-value]="dataValue()">
    {{ label() }}
  </mat-checkbox>
  @if (formControl.errors?.['inlineError'] && formControl.touched) {
    <mat-error>
      {{ inlineError() }}
    </mat-error>
  }
}
