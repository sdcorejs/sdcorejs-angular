<div mat-dialog-title class="">
  @if (data.icon) {
    <sd-icon [name]="data.icon"></sd-icon>
  }
  <span class="T24M" [innerHtml]="data.title || 'Confirm'"></span>
</div>
<div mat-dialog-content>
  <div class="T14R mb-4" [innerHtml]="data.message"></div>
  @if (data.input) {
    <sd-textarea [placeholder]="data.input.placeholder" [(model)]="value" [rows]="5" [maxlength]="data.input.maxlength!" />
  }
  @if (data.date) {
    <sd-date
      [placeholder]="data.date.placeholder"
      [(model)]="value"
      type="date"
      [min]="data.date.min!"
      [max]="data.date.max!"
      [required]="data.date.required">
    </sd-date>
  }
  @if (data.radio) {
    <sd-radio
      [items]="data.radio.items"
      [valueField]="data.radio.valueField"
      [displayField]="data.radio.displayField"
      [display]="data.radio.display || 'column'"
      [(model)]="value"
      [required]="data.radio.required">
    </sd-radio>
  }
</div>
<div mat-dialog-actions align="end">
  @if (data.noTitle) {
    <sd-button [color]="data.noButtonColor || 'secondary'" [title]="data.noTitle" (click)="onCancel()"></sd-button>
  }
  @if (data.yesTitle) {
    <sd-button
      class="ml-8"
      type="fill"
      [color]="data.yesButtonColor || 'primary'"
      [disabled]="required && !value"
      cdkFocusInitial
      [title]="data.yesTitle"
      (click)="onAccept()"></sd-button>
  }
</div>
