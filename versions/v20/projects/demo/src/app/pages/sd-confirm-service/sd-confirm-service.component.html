<div style="padding: 16px; display: flex; flex-direction: column; gap: 16px">
  <h2>SD Confirm Service Examples</h2>
  
  <!-- Basic Confirm -->
  <sd-section title="Basic Confirm" subTitle="Simple confirmation dialog">
    <sd-button title="Show Basic Confirm" (click)="showBasicConfirm()"></sd-button>
  </sd-section>

  <!-- Custom Confirm -->
  <sd-section title="Custom Confirm" subTitle="Confirmation with custom options">
    <sd-button title="Show Custom Confirm" (click)="showCustomConfirm()"></sd-button>
  </sd-section>

  <!-- Closable Confirm -->
  <sd-section title="Closable Confirm" subTitle="Confirmation with disableBackdropClose = false">
    <sd-button title="Show Closable Confirm" (click)="showConfirmWithDisableBackdropClose()"></sd-button>
  </sd-section>

  <!-- Confirm with Input -->
  <sd-section title="Confirm with Input" subTitle="Confirmation dialog with text input">
    <sd-button title="Show Confirm with Input" (click)="showConfirmWithInput()"></sd-button>
  </sd-section>

  <!-- Confirm with Date -->
  <sd-section title="Confirm with Date" subTitle="Confirmation dialog with date picker">
    <sd-button title="Show Confirm with Date" (click)="showConfirmWithDate()"></sd-button>
  </sd-section>

  <!-- Confirm with Radio (Column) -->
  <sd-section title="Confirm with Radio (Column)" subTitle="Confirmation dialog with radio buttons in column layout">
    <sd-button title="Show Confirm with Radio (Column)" (click)="showConfirmWithRadio()"></sd-button>
  </sd-section>

  <!-- Confirm with Radio (Row) -->
  <sd-section title="Confirm with Radio (Row)" subTitle="Confirmation dialog with radio buttons in row layout">
    <sd-button title="Show Confirm with Radio (Row)" (click)="showConfirmWithRadioRow()"></sd-button>
  </sd-section>
</div>
