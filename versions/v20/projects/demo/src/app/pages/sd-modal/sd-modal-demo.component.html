<div style="padding: 16px; display: flex; flex-direction: column; gap: 16px">
  <h2>SD Modal Examples</h2>

  <sd-section title="Basic Modal" subTitle="Standard modal with close icon and backdrop dismiss">
    <sd-button title="Open Basic Modal" (click)="basicModal.open()"></sd-button>
    
    <sd-modal #basicModal title="Basic Modal" [disableBackdropClose]="false" [hideClose]="false">
      <div style="padding: 16px">This is a basic modal. You can close it by clicking the X icon or clicking outside.</div>
      <div sdFooter>
        <sd-button title="Close" type="outline" (click)="basicModal.close()"></sd-button>
      </div>
    </sd-modal>
  </sd-section>

  <sd-section title="Strict Modal" subTitle="Modal with hideClose=true and disableBackdropClose=true">
    <sd-button title="Open Strict Modal" (click)="strictModal.open()"></sd-button>
    
    <sd-modal #strictModal title="Strict Modal" [disableBackdropClose]="true" [hideClose]="true">
      <div style="padding: 16px">
        This modal cannot be closed by clicking outside and has no X icon.
      </div>
      <div sdFooter>
        <sd-button title="Close Programmatically" (click)="strictModal.close()"></sd-button>
      </div>
    </sd-modal>
  </sd-section>
</div>
